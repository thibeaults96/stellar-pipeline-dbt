name: stellar_pipeline
version: '1.0.0'
config-version: 2
profile: stellar

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Force the timestamp-shaped columns in raw_shipments to load as VARCHAR
# so the staging cast() in stg_shipments.sql is meaningful. Don't remove
# this — earlier levels rely on it.
seeds:
  stellar_pipeline:
    raw_shipments:
      +column_types:
        departed_at: VARCHAR
        arrived_at: VARCHAR

# Per-model materializations are configured inline at the top of each
# model file (e.g. {{ config(materialized='table') }} in fct_trade_routes.sql).
# Project-level per-folder materialization config could also live here under
# a `models:` block — kept out of this game so the inline pattern stays the
# single source of truth for what each model materializes as.
