version: 2

models:
  - name: stg_shipments
    description: "Cleaned and typed shipment records from raw Federation sensor data."
    columns:
      - name: shipment_id
        description: "Unique identifier for each shipment."
        tests:
          - not_null
          - unique
      - name: status
        description: "Current shipment status, lowercased."
        tests:
          - not_null
