version: 2

models:
  - name: fct_voss_investigation
    description: "Suspicious shipments flagged for Federation Command review."
    columns:
      - name: shipment_id
        description: "Unique identifier for each flagged shipment."
        tests:
          - not_null
          - unique
      - name: is_suspicious
        description: "Flag set to 1 for shipments meeting any suspicious criteria."
        tests:
          - not_null
