# shipment_snapshots.yml
#
# SNAPSHOTS track how rows change over time. Unlike regular models that
# always show current state, a snapshot keeps a history of every change.
#
# In dbt, snapshots are defined in YAML files in the snapshots/ folder.
# Each snapshot needs:
#   - name: what to call the snapshot table
#   - relation: which model or source to snapshot (using ref() or source())
#   - config: how to detect changes
#
# The 'timestamp' strategy compares the updated_at column to detect changes.
# The 'unique_key' tells dbt which column identifies each row.
#
# dbt automatically adds tracking columns:
#   dbt_valid_from  — when this version of the row became active
#   dbt_valid_to    — when it was replaced (NULL if still current)
#   dbt_scd_id      — unique ID for each version
#
# Check the objectives panel for specifics.
