id: 9
title: "Schedule the Refresh"
subtitle: "Wire a job: commands + environment + schedule, then trigger it."
character: "NAV"
xp_reward: 260

badge:
  id: scheduler
  emoji: "⏰"
  name: "Scheduler"
  description: "Defined a job — a command sequence, an environment, and a schedule — and watched it run."
  xp: 260

locked_files:
  - models/staging/stg_planets.sql
  - models/staging/stg_shipments.sql
  - models/marts/fct_trade_routes.sql

seed_files:
  raw_shipments.csv: "shipment_id,origin_planet,dest_planet,cargo_type,cargo_mass,departed_at,arrived_at,status,loaded_at\nSHP-001,K7B,MRD-9,supplies,1200kg,2847-03-01T08:00:00Z,2847-03-02T14:00:00Z,DELIVERED,2847-03-02T06:00:00Z\nSHP-002,TAU-4,K7B,equipment,4500kg,2847-03-01T12:00:00Z,2847-03-03T08:00:00Z,DELIVERED,2847-03-03T07:00:00Z\nSHP-003,MRD-9,ALF-C,humanitarian_aid,800kg,2847-02-28T22:00:00Z,2847-03-02T18:00:00Z,DELIVERED,2847-03-02T19:00:00Z\nSHP-004,ALF-C,TAU-4,fuel_cells,9200kg,2847-03-02T06:00:00Z,2847-03-04T10:00:00Z,DELIVERED,2847-03-04T10:30:00Z\nSHP-005,K7B,MRD-9,medical,340kg,2847-03-03T14:00:00Z,2847-03-04T22:00:00Z,DELIVERED,2847-03-04T22:30:00Z\nSHP-006,K7B,MRD-9,supplies,2100kg,2847-03-04T08:00:00Z,2847-03-05T06:00:00Z,DELIVERED,2847-03-05T06:30:00Z\n"

initial_files:
  models/staging/stg_shipments.sql: |
    -- stg_shipments.sql (carried forward)

    with source as (
        select * from {{ source('helios', 'raw_shipments') }}
    ),
    renamed as (
        select
            shipment_id,
            origin_planet as origin_planet_id,
            dest_planet as destination_planet_id,
            cargo_type,
            cast(replace(cargo_mass, 'kg', '') as integer) as cargo_mass_kg,
            cast(departed_at as timestamp) as departed_at,
            cast(arrived_at as timestamp) as arrived_at,
            lower(status) as status
        from source
    )
    select * from renamed

  models/marts/fct_trade_routes.sql: |
    -- fct_trade_routes.sql (carried forward)
    {{ config(materialized='table') }}

    with shipments as (
        select * from {{ ref('stg_shipments') }}
    ), planets as (
        select * from {{ ref('stg_planets') }}
    ), routes as (
        select
            s.shipment_id, s.cargo_type, s.cargo_mass_kg, s.status,
            s.departed_at, s.arrived_at,
            origin.planet_name as origin_planet_name,
            dest.planet_name as destination_planet_name
        from shipments s
        left join planets origin on s.origin_planet_id = origin.planet_id
        left join planets dest on s.destination_planet_id = dest.planet_id
    )
    select * from routes

  models/sources/helios_sources.yml: |
    version: 2

    sources:
      - name: helios
        description: "Raw cargo telemetry from Helios Waystation receivers"
        schema: main
        tables:
          - name: raw_shipments
            description: "Cargo shipment records (loaded by the scheduled job)"
            loaded_at_field: loaded_at
            freshness:
              warn_after: {count: 24, period: hour}
              error_after: {count: 48, period: hour}
          - name: raw_planets
            description: "Planetary registry: ports of call along Helios routes"

objectives:
  # ── 1. Point the job at an environment ──
  - id: pick_environment
    label: "Point the job at the environment you set up last level (SCHEDULE tab → step 1)"
    hint: "Open the SCHEDULE tab and pick your environment from the dropdown. A job that isn't bound to an environment has nowhere to run — the platform will refuse to schedule it."
    check:
      type: schedule_environment

  # ── 2. Define the command sequence ──
  - id: add_build_command
    label: "Add `dbt build` to the job's command list"
    hint: "In the SCHEDULE tab's command box, type `dbt build` on its own line. This is the workhorse — it seeds, runs, tests, and snapshots in dependency order, in a single command."
    check:
      type: schedule_commands
      required: ["dbt build"]

  - id: add_freshness_command
    label: "Add `dbt source freshness` to the command list (after the build)"
    hint: "On a new line below `dbt build`, type `dbt source freshness`. Real production jobs run freshness as a separate step so a freshness warning doesn't block the rest of the pipeline. Order matters here — the scheduler runs commands top to bottom."
    check:
      type: schedule_commands
      required: ["dbt build", "dbt source freshness"]
      min_count: 2

  - id: add_select_command
    label: "Add a `dbt run --select stg_shipments+` partial-refresh command"
    hint: "Add a third line: `dbt run --select stg_shipments+`. The `+` operator means \"this model and everything downstream of it.\" Real-world use: rerunning a fix to a staging model without rebuilding upstream sources or unrelated marts. dbt supports tag selection too (`tag:hourly`), path selection (`staging.+`), and combinations."
    check:
      type: schedule_commands
      required: ["dbt run --select stg_shipments+"]

  # ── 3. Pick when it runs ──
  - id: pick_schedule
    label: "Pick a schedule kind (and expression for Interval or Cron)"
    hint: "Step 3 of the SCHEDULE tab. Four options — Manual / Interval / Cron / On-merge — each documented in the panel. For Helios, `Interval 6h` and `Cron 0 */6 * * *` are both reasonable. No single right answer."
    check:
      type: schedule_state
      kind: null
      min_runs: 0

  # ── 4. Trigger the first run ──
  - id: trigger_run
    label: "Click 'Trigger scheduled run' — fire the job once"
    hint: "This actually runs your command list in order against the environment. Watch the terminal: you'll see each command execute, dbt's output for each, and the job stop if anything fails."
    check:
      type: schedule_state
      min_runs: 1

  # ── 5. Trigger again — schedules are about repetition ──
  - id: trigger_again
    label: "Trigger a second run — schedules are about repetition, not one-shots"
    hint: "Real production schedules run between every 15 minutes and once a day. The first run loads the warehouse; every later run just keeps it fresh. Click trigger one more time."
    check:
      type: schedule_state
      min_runs: 2

