id: 4
title: "The Refresh Crisis"
subtitle: "Build an incremental model. Process only what's new."
character: "R0-B3RT"
xp_reward: 220

badge:
  id: incremental_engineer
  emoji: "\u26a1"
  name: "Incremental Engineer"
  description: "Built an incremental model that only processes new data instead of rebuilding everything."
  xp: 220

locked_files:
  - models/staging/stg_planets.sql
  - models/staging/stg_shipments.sql
  - models/marts/fct_trade_routes.sql

seed_files:
  raw_shipments.csv: "shipment_id,origin_planet,dest_planet,cargo_type,cargo_mass,departed_at,arrived_at,status,voss_flag,updated_at\nSHP-001,K7B,MRD-9,supplies,1200kg,2847-03-01T08:00:00Z,2847-03-02T14:00:00Z,DELIVERED,0,2847-03-02T14:00:00Z\nSHP-002,TAU-4,K7B,equipment,4500kg,2847-03-01T12:00:00Z,2847-03-03T08:00:00Z,DELIVERED,0,2847-03-03T08:00:00Z\nSHP-003,MRD-9,NM-00,humanitarian_aid,800kg,2847-02-28T22:00:00Z,,IN_TRANSIT,1,2847-03-04T00:00:00Z\nSHP-004,ALF-C,TAU-4,fuel_cells,9200kg,2847-03-02T06:00:00Z,2847-03-04T10:00:00Z,DELIVERED,0,2847-03-04T10:00:00Z\nSHP-005,K7B,MRD-9,medical,340kg,2847-03-03T14:00:00Z,2847-03-04T22:00:00Z,DELIVERED,0,2847-03-04T22:00:00Z\nSHP-006,K7B,NM-00,classified,2200kg,2847-03-04T01:00:00Z,,IN_TRANSIT,1,2847-03-05T00:00:00Z\nSHP-007,TAU-4,MRD-9,supplies,3100kg,2847-03-05T06:00:00Z,,IN_TRANSIT,0,2847-03-05T06:00:00Z\nSHP-008,K7B,ALF-C,medical,780kg,2847-03-05T08:00:00Z,,IN_TRANSIT,0,2847-03-05T08:00:00Z\n"

initial_files:
  models/staging/stg_shipments.sql: |
    -- stg_shipments.sql (carried forward)

    with source as (
        select * from {{ source('federation', 'raw_shipments') }}
    ),
    renamed as (
        select shipment_id, origin_planet as origin_planet_id,
            dest_planet as destination_planet_id, cargo_type,
            cast(replace(cargo_mass, 'kg', '') as integer) as cargo_mass_kg,
            cast(departed_at as timestamp) as departed_at,
            cast(arrived_at as timestamp) as arrived_at,
            lower(status) as status, voss_flag, updated_at
        from source
    )
    select * from renamed

  models/marts/fct_trade_routes.sql: |
    -- fct_trade_routes.sql (carried forward)

    with shipments as (
        select * from {{ ref('stg_shipments') }}
    ), planets as (
        select * from {{ ref('stg_planets') }}
    ), routes as (
        select s.shipment_id, s.cargo_type, s.cargo_mass_kg, s.status,
            s.departed_at, s.arrived_at,
            origin.planet_name as origin_planet_name,
            dest.planet_name as destination_planet_name
        from shipments s
        left join planets origin on s.origin_planet_id = origin.planet_id
        left join planets dest on s.destination_planet_id = dest.planet_id
    )
    select * from routes

  models/marts/fct_shipment_log.sql: |
    -- fct_shipment_log.sql
    --
    -- This model should be INCREMENTAL. Instead of rebuilding all data every
    -- run, it should only process rows that are new or updated since the
    -- last run.
    --
    -- The shape of an incremental model in dbt:
    --
    --   {{ config(materialized='incremental', unique_key='key_column') }}
    --
    --   select * from {{ ref('...') }}
    --
    --   {% if is_incremental() %}
    --     where update_column > (select max(update_column) from {{ this }})
    --   {% endif %}
    --
    -- What each piece does:
    --   * config(...): materialized='incremental' means dbt does NOT rebuild
    --     this table from scratch. unique_key='shipment_id' tells dbt to
    --     upsert (update if exists, insert if new) by shipment_id.
    --   * is_incremental() returns FALSE on the first run (full load) and
    --     TRUE on every run after that.
    --   * {{ this }} resolves to the model's own existing table — letting
    --     you say "give me rows newer than what's already loaded".
    --
    -- The updated_at column in stg_shipments tracks when each row last changed.
    -- Use it as the watermark in the WHERE clause.

    select 1 as placeholder
    -- Replace this with your incremental model

  models/sources/federation_sources.yml: |
    version: 2

    sources:
      - name: federation
        description: "Raw telemetry data from Federation sensor arrays"
        schema: main
        tables:
          - name: raw_shipments
            description: "Cargo shipment records from all registered vessels"
          - name: raw_planets
            description: "Planetary registry and resource data"

objectives:
  - id: set_materialization
    label: "Set fct_shipment_log to materialized='incremental'"
    hint: "Add a config block at the top of fct_shipment_log.sql. The syntax is: {{ config(materialized='incremental') }}"
    # Read the resolved materialization from manifest.json. dbt computes the
    # effective config from the file plus dbt_project.yml, so this passes
    # only when the model truly is incremental — not just when the text
    # appears somewhere in the file.
    check:
      type: manifest_model_config
      model: fct_shipment_log
      key: materialized
      value: incremental

  - id: add_unique_key
    label: "Set unique_key='shipment_id' in the config"
    hint: "Inside the config block, add unique_key='shipment_id'. This tells dbt to upsert (update if exists, insert if new) based on shipment_id."
    check:
      type: manifest_model_config
      model: fct_shipment_log
      key: unique_key
      value: shipment_id

  - id: ref_shipments
    label: "Use ref('stg_shipments') in the model"
    hint: "Pull data from stg_shipments using ref(). Same pattern as before."
    check:
      type: has_ref_call
      filename: models/marts/fct_shipment_log.sql
      target_model: stg_shipments

  - id: add_is_incremental
    label: "Add an is_incremental() filter for delta processing on updated_at using {{this}}"
    hint: "Add a WHERE clause that only runs on incremental loads. The pattern is: {% if is_incremental() %} where updated_at > (select max(updated_at) from {{ this }}) {% endif %}"
    # depends_on.macros only includes is_incremental when the Jinja was
    # actually evaluated by dbt's parser — a stray reference in a comment or
    # docstring won't show up here, unlike a regex match.
    check:
      type: manifest_model_depends_on_macro
      model: fct_shipment_log
      macro_name: is_incremental

  - id: all_green
    label: "Run dbt and all models pass"
    hint: "Click 'dbt run' to build all models including the new incremental one."
    check:
      type: all_models_pass

narrative_triggers:
  - id: nt_start
    event: LEVEL_START
    narrative_key: intro
    once: true

  - id: nt_start_guide
    event: LEVEL_START
    narrative_key: incremental_guide
    once: true

  - id: nt_first_run
    event: FIRST_RUN
    narrative_key: first_run
    once: true

  - id: nt_config_done
    event: OBJECTIVE_set_materialization_COMPLETE
    narrative_key: config_done
    once: true

  - id: nt_ref_done
    event: OBJECTIVE_ref_shipments_COMPLETE
    narrative_key: ref_done
    once: true

  - id: nt_incremental_done
    event: OBJECTIVE_add_is_incremental_COMPLETE
    narrative_key: incremental_explain
    once: true

  - id: nt_complete
    event: LEVEL_COMPLETE
    narrative_key: level_complete
    once: true

narrative_script:
  intro:
    id: intro
    character: R0-B3RT
    message: "We've got a problem. Shipment volume is up 40% and the full pipeline rebuild is taking too long. Every time we run dbt, it rebuilds everything from scratch. We need a model that only processes <highlight>new and updated records</highlight>. That's what incremental models are for."
    priority: high

  incremental_guide:
    id: incremental_guide
    character: R0-B3RT
    message: "Open <highlight>fct_shipment_log.sql</highlight>. The shape is: a config block declaring it incremental and naming the unique_key, then a select from {{ ref('stg_shipments') }}, then a Jinja <highlight>{% if is_incremental() %} where updated_at > (select max(updated_at) from {{ this }}) {% endif %}</highlight> filter. The first run loads everything. Every later run only picks up rows newer than what's already loaded. Start by adding the config block."
    priority: normal

  first_run:
    id: first_run
    character: R0-B3RT
    message: "The existing models ran fine. Now you need to build fct_shipment_log as an incremental model. On its first run, it'll load all the data. On every run after that, it'll only grab rows where updated_at is newer than the last processed timestamp."
    priority: normal

  config_done:
    id: config_done
    character: R0-B3RT
    message: "Good, the config is set. <highlight>materialized='incremental'</highlight> tells dbt this model doesn't rebuild from scratch. And <highlight>unique_key='shipment_id'</highlight> means if a row with the same shipment_id comes in again, it updates the existing row instead of duplicating it. Now add the ref() and build out the query."
    priority: normal

  ref_done:
    id: ref_done
    character: R0-B3RT
    message: "Data source is wired up. Now the key part: the <highlight>is_incremental()</highlight> filter. You need a WHERE clause that only applies on incremental runs (not the first full load). The pattern is: use is_incremental() in a Jinja if block, and filter where updated_at is greater than the max updated_at already in the table."
    priority: normal

  incremental_explain:
    id: incremental_explain
    character: R0-B3RT
    message: "That's the pattern. On the first run, dbt loads everything because is_incremental() returns false. On every run after that, it only grabs rows newer than what's already in the table. This is how production pipelines handle large volumes without full rebuilds every time."
    priority: normal

  level_complete:
    id: level_complete
    character: R0-B3RT
    message: "Pipeline runs in a fraction of the time now. Good work. One thing though, those VOSS-flagged shipments to Null Meridian keep showing up in the incremental loads. Classified cargo going to an uncharted planet that isn't even a Federation member. Something doesn't add up."
    priority: high
