id: 4
title: "The Source of Truth"
subtitle: "Lock down where the raw data comes from — and how stale it can get."
character: "NAV"
xp_reward: 200

badge:
  id: source_keeper
  emoji: "\U0001f9ed"
  name: "Source Keeper"
  description: "Configured source freshness so dbt flags stale raw data automatically."
  xp: 200

locked_files:
  - models/staging/stg_planets.sql
  - models/staging/stg_shipments.sql
  - models/marts/fct_trade_routes.sql

seed_files:
  raw_shipments.csv: "shipment_id,origin_planet,dest_planet,cargo_type,cargo_mass,departed_at,arrived_at,status,loaded_at\nSHP-001,K7B,MRD-9,supplies,1200kg,2847-03-01T08:00:00Z,2847-03-02T14:00:00Z,DELIVERED,2847-03-02T06:00:00Z\nSHP-002,TAU-4,K7B,equipment,4500kg,2847-03-01T12:00:00Z,2847-03-03T08:00:00Z,DELIVERED,2847-03-03T07:00:00Z\nSHP-003,MRD-9,ALF-C,humanitarian_aid,800kg,2847-02-28T22:00:00Z,2847-03-02T18:00:00Z,DELIVERED,2847-03-02T19:00:00Z\nSHP-004,ALF-C,TAU-4,fuel_cells,9200kg,2847-03-02T06:00:00Z,2847-03-04T10:00:00Z,DELIVERED,2847-03-04T10:30:00Z\nSHP-005,K7B,MRD-9,medical,340kg,2847-03-03T14:00:00Z,2847-03-04T22:00:00Z,DELIVERED,2847-03-04T22:30:00Z\nSHP-006,K7B,MRD-9,supplies,2100kg,2847-03-04T08:00:00Z,2847-03-05T06:00:00Z,DELIVERED,2847-03-05T06:30:00Z\n"

initial_files:
  models/staging/stg_shipments.sql: |
    -- stg_shipments.sql (carried forward from First Models)

    with source as (

        select * from {{ source('helios', 'raw_shipments') }}

    ),

    renamed as (

        select
            shipment_id,
            origin_planet as origin_planet_id,
            dest_planet as destination_planet_id,
            cargo_type,
            cast(replace(cargo_mass, 'kg', '') as integer) as cargo_mass_kg,
            cast(departed_at as timestamp) as departed_at,
            cast(arrived_at as timestamp) as arrived_at,
            lower(status) as status

        from source

    )

    select * from renamed

  models/marts/fct_trade_routes.sql: |
    -- fct_trade_routes.sql (carried forward from First Models)
    {{ config(materialized='table') }}

    with shipments as (

        select * from {{ ref('stg_shipments') }}

    ),

    planets as (

        select * from {{ ref('stg_planets') }}

    ),

    routes as (

        select
            s.shipment_id,
            s.cargo_type,
            s.cargo_mass_kg,
            s.status,
            s.departed_at,
            s.arrived_at,
            origin.planet_name as origin_planet_name,
            dest.planet_name as destination_planet_name,
            origin.sector as origin_sector

        from shipments s
        left join planets origin on s.origin_planet_id = origin.planet_id
        left join planets dest on s.destination_planet_id = dest.planet_id

    )

    select * from routes

  models/sources/helios_sources.yml: |
    # helios_sources.yml
    #
    # raw_shipments now has a `loaded_at` column — the dock crew stamps it
    # whenever a row hits the receiver. That gives us something to compare
    # against for freshness checks.
    #
    # Your job: add a `freshness:` block to raw_shipments so dbt knows when
    # the data is stale. The shape is:
    #
    #   - name: raw_shipments
    #     loaded_at_field: loaded_at
    #     freshness:
    #       warn_after: {count: 24, period: hour}
    #       error_after: {count: 48, period: hour}
    #
    # Then click `dbt freshness` in the toolbar to actually run the check.

    version: 2

    sources:
      - name: helios
        description: "Raw cargo telemetry from Helios Waystation receivers"
        schema: main
        tables:
          - name: raw_shipments
            description: "Cargo shipment records from inbound and outbound vessels"
            # TODO: add loaded_at_field and a freshness: block here.

          - name: raw_planets
            description: "Planetary registry: ports of call along Helios routes"

objectives:
  - id: initial_run
    label: "Click 'dbt run' first — confirms the pipeline still builds with new raw data"
    hint: "The carried-forward staging and mart models still work since they only project the columns they care about. Run dbt to lay down stg_shipments and fct_trade_routes — the freshness check needs a working warehouse to point at."
    # model_passes on the leaf confirms the full chain compiled, without
    # gating on every other objective the way all_models_pass does.
    check:
      type: model_passes
      model: fct_trade_routes

  - id: configure_freshness
    label: "Add a freshness block to raw_shipments (loaded_at_field + warn_after + error_after)"
    hint: "Inside the raw_shipments entry, add `loaded_at_field: loaded_at`, then a `freshness:` block with `warn_after: {count: 24, period: hour}` and `error_after: {count: 48, period: hour}`. dbt walks the YAML structurally — every key has to be in the right place."
    check:
      type: has_freshness_config
      source_name: helios
      table_name: raw_shipments

  - id: run_freshness
    label: "Click 'dbt freshness' — run the actual freshness check against the live data"
    hint: "dbt source freshness runs a real SQL query: `select max(loaded_at) from raw_shipments`, then compares the age of the newest row to your warn/error thresholds. If the YAML is malformed it errors out and tells you exactly what's wrong. If it runs (pass / warn / error all count), the config is structurally valid."
    check:
      type: source_freshness_ran
      source_name: helios
      table_name: raw_shipments

  - id: all_green
    label: "Click 'dbt run' once more — everything still builds with the new source config"
    hint: "Source config is metadata to dbt — it doesn't change how models compile, just adds the freshness contract. Confirm the pipeline still runs clean."
    check:
      type: all_models_pass

narrative_triggers:
  - id: nt_intro
    event: LEVEL_START
    narrative_key: intro
    once: true

  - id: nt_start_guide
    event: LEVEL_START
    narrative_key: freshness_guide
    once: true

  - id: nt_first_run
    event: OBJECTIVE_initial_run_COMPLETE
    narrative_key: lineage_hint
    once: true

  - id: nt_freshness_done
    event: OBJECTIVE_configure_freshness_COMPLETE
    narrative_key: freshness_done
    once: true

  - id: nt_freshness_ran
    event: OBJECTIVE_run_freshness_COMPLETE
    narrative_key: freshness_ran
    once: true

  - id: nt_freshness_fail
    event: FRESHNESS_FAILURE
    narrative_key: freshness_failure
    once: true

  - id: nt_level_complete
    event: LEVEL_COMPLETE
    narrative_key: level_complete
    once: true

narrative_script:
  intro:
    id: intro
    character: NAV
    message: "Let me tell you about last quarter. The receiver array at dock 3 went dark for 14 hours and nobody caught it until Holt's morning report showed shipments down 60%, at which point she paged the wrong team. <highlight>The data wasn't wrong. The data wasn't there.</highlight> So this level we set up source freshness, which lets dbt flag that kind of thing on its own instead of waiting on someone to spot it."
    priority: high

  freshness_guide:
    id: freshness_guide
    character: NAV
    message: "Open <highlight>helios_sources.yml</highlight>. raw_shipments picked up a new <highlight>loaded_at</highlight> column, which is the timestamp the dock crew stamps whenever a row lands in the warehouse. You're going to wire it up as a <highlight>freshness contract</highlight>. Tell dbt which column tracks freshness, then set your warn and error thresholds. When that's in, hit <highlight>dbt freshness</highlight> in the toolbar to run the check for real."
    priority: normal

  lineage_hint:
    id: lineage_hint
    character: NAV
    message: "While the pipeline builds, open the <highlight>DAG</highlight> tab at the bottom. dbt generates that graph straight from your source() and ref() calls, and the sources are the nodes with nothing feeding into them. <highlight>That's lineage</highlight>, and it's the exact same graph the docs site renders. The reason sources matter is that they keep the graph honest: raw tables become explicit nodes instead of assumptions you're carrying in your head."
    priority: normal

  freshness_done:
    id: freshness_done
    character: NAV
    message: "Config looks good. Go click <highlight>dbt freshness</highlight> in the toolbar, which is just <highlight>dbt source freshness</highlight> under the hood. It runs a SQL query against each source and reports back pass, warn, or error. And if your YAML is off, dbt will tell you exactly where."
    priority: normal

  freshness_ran:
    id: freshness_ran
    character: NAV
    message: "Freshness ran clean. In a real deploy you'd schedule that command every few hours, and a `warn` or `error` result would page on-call. Do that, and a data outage stops being something you find out about from an angry stakeholder. <highlight>dbt sees it first.</highlight>"
    priority: high

  freshness_failure:
    id: freshness_failure
    character: NAV
    message: "Freshness errored out, which means the YAML didn't parse the way dbt expected. Read the error in the terminal; it points right at the line. The usual suspects: a missing <highlight>loaded_at_field</highlight>, the wrong period name (it has to be minute, hour, or day), or warn_after / error_after pointing at a plain value instead of a {count, period} mapping."
    priority: high

  level_complete:
    id: level_complete
    character: NAV
    message: "Sources are first-class citizens now. Lineage is honest, freshness is monitored, and the next dock outage gets caught by dbt instead of by Holt's coffee. So that's <highlight>sources</highlight> handled. Next up is tests, because nothing in this data has actually been validated yet, and trust me, the dock crew gets creative with how they type things in."
    priority: high

quiz:
  - question: "What does `dbt source freshness` check?"
    options:
      - "How recently a source table was last loaded, based on a timestamp column you point it at"
      - "Whether your models are using the latest dbt version"
      - "Whether your sources have any rows at all"
      - "Whether your YAML files have been updated this week"
    correct: 0
    explanation: "Freshness compares the max value of `loaded_at_field` against now(). It's how you catch stale raw data, like an EL pipeline that quietly stopped delivering."
  - question: "What's the difference between `warn_after` and `error_after` in a freshness config?"
    options:
      - "`warn_after` raises a warning when data is older than the threshold; `error_after` fails the freshness check"
      - "They're aliases for the same thing"
      - "`warn_after` runs the test daily, `error_after` runs it hourly"
      - "`warn_after` is for development, `error_after` is for production"
    correct: 0
    explanation: "It's two-tier alerting. A warn says the data is getting stale, while an error says it's broken and the job should fail. That way you can flag drift before it turns into downtime."
