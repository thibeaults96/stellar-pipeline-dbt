id: 6
title: "Tell the Story"
subtitle: "Descriptions, doc blocks, and a self-explaining warehouse."
character: "NAV"
xp_reward: 220

badge:
  id: data_librarian
  emoji: "\U0001f4d6"
  name: "Data Librarian"
  description: "Wrote model and column descriptions and shipped a doc block — the warehouse explains itself now."
  xp: 220

locked_files:
  - models/staging/stg_planets.sql
  - models/staging/stg_shipments.sql
  - models/marts/fct_trade_routes.sql

seed_files:
  raw_shipments.csv: "shipment_id,origin_planet,dest_planet,cargo_type,cargo_mass,departed_at,arrived_at,status\nSHP-001,K7B,MRD-9,supplies,1200kg,2847-03-01T08:00:00Z,2847-03-02T14:00:00Z,DELIVERED\nSHP-002,TAU-4,K7B,equipment,4500kg,2847-03-01T12:00:00Z,2847-03-03T08:00:00Z,DELIVERED\nSHP-003,MRD-9,ALF-C,humanitarian_aid,800kg,2847-02-28T22:00:00Z,2847-03-02T18:00:00Z,DELIVERED\nSHP-004,ALF-C,TAU-4,fuel_cells,9200kg,2847-03-02T06:00:00Z,2847-03-04T10:00:00Z,DELIVERED\nSHP-005,K7B,MRD-9,medical,340kg,2847-03-03T14:00:00Z,2847-03-04T22:00:00Z,DELIVERED\n"

initial_files:
  models/staging/stg_shipments.sql: |
    -- stg_shipments.sql (carried forward)

    with source as (
        select * from {{ source('helios', 'raw_shipments') }}
    ),
    renamed as (
        select
            shipment_id,
            origin_planet as origin_planet_id,
            dest_planet as destination_planet_id,
            cargo_type,
            cast(replace(cargo_mass, 'kg', '') as integer) as cargo_mass_kg,
            cast(departed_at as timestamp) as departed_at,
            cast(arrived_at as timestamp) as arrived_at,
            lower(status) as status
        from source
    )
    select * from renamed

  models/marts/fct_trade_routes.sql: |
    -- fct_trade_routes.sql (carried forward)
    {{ config(materialized='table') }}

    with shipments as (
        select * from {{ ref('stg_shipments') }}
    ), planets as (
        select * from {{ ref('stg_planets') }}
    ), routes as (
        select
            s.shipment_id, s.cargo_type, s.cargo_mass_kg, s.status,
            s.departed_at, s.arrived_at,
            origin.planet_name as origin_planet_name,
            dest.planet_name as destination_planet_name,
            origin.sector as origin_sector
        from shipments s
        left join planets origin on s.origin_planet_id = origin.planet_id
        left join planets dest on s.destination_planet_id = dest.planet_id
    )
    select * from routes

  models/sources/helios_sources.yml: |
    version: 2

    sources:
      - name: helios
        description: "Raw cargo telemetry from Helios Waystation receivers"
        schema: main
        tables:
          - name: raw_shipments
            description: "Cargo shipment records from inbound and outbound vessels"
          - name: raw_planets
            description: "Planetary registry: ports of call along Helios routes"

  models/staging/_stg_shipments.yml: |
    version: 2

    models:
      - name: stg_shipments
        # TODO: add a model description. One sentence — what does this model produce?

        columns:
          - name: shipment_id
            # TODO: add a column description. What is this column for?

          - name: cargo_type
            # TODO: add a column description.
            # Consider using a `{{ doc('cargo_type') }}` doc block reference here
            # so the long-form explanation lives in a Markdown file instead.
            # If you do, your description: line will look like:
            #   description: "{{ doc('cargo_type') }}"

          - name: status
            description: "Lowercased shipment status — 'delivered' or 'in_transit'."

  models/marts/_fct_trade_routes.yml: |
    version: 2

    models:
      - name: fct_trade_routes
        # TODO: add a model description. Analysts read this in the docs site.
        columns:
          - name: shipment_id
            description: "Unique shipment identifier carried through from staging."
          - name: origin_planet_name
            description: "Human-readable name of the origin planet."
          - name: destination_planet_name
            description: "Human-readable name of the destination planet."

  models/_docs.md: |
    {# Doc blocks live in .md files anywhere under models/. Reference them from
       a YAML description with {{ doc('block_name') }}, and dbt swaps the
       rendered markdown in at compile time. Useful for long-form context that
       would clutter a YAML.

       Replace the TODO below with a docs block named `cargo_type`. The shape:

           {% docs cargo_type %}
           Cargo category as logged by the dock crew. Allowed values:
           supplies, equipment, humanitarian_aid, fuel_cells, medical.
           {% enddocs %}

       Then in _stg_shipments.yml, set cargo_type's description to:
           "{{ doc('cargo_type') }}"
    #}

    {# TODO: write a {% docs cargo_type %} ... {% enddocs %} block below. #}

objectives:
  - id: describe_stg_model
    label: "Add a description to the stg_shipments model"
    hint: "In _stg_shipments.yml, replace the model-level TODO with a `description:` line. Write at least a sentence — what does this model produce, and from where?"
    check:
      type: manifest_model_description
      model: stg_shipments
      min_length: 20

  - id: describe_shipment_id
    label: "Add a description to the shipment_id column"
    hint: "Under shipment_id, add `description: \"Unique identifier for each shipment\"` (or similar). Descriptions show up in dbt's docs site and in the manifest your downstream tooling can read."
    check:
      type: manifest_column_description
      model: stg_shipments
      column: shipment_id
      min_length: 15

  - id: write_doc_block
    label: "Write a `{% docs cargo_type %}` block in models/_docs.md"
    hint: "Open _docs.md and add: `{% docs cargo_type %}` ... markdown content ... `{% enddocs %}`. Doc blocks are reusable long-form descriptions that live outside the YAML."
    check:
      type: file_contains
      filename: models/_docs.md
      pattern: "\\{%\\s*docs\\s+cargo_type\\s*%\\}"

  - id: reference_doc_block
    label: "Reference the doc block from cargo_type's description"
    hint: "In _stg_shipments.yml, set cargo_type's description to `\"{{ doc('cargo_type') }}\"`. dbt swaps in the rendered markdown when it compiles."
    check:
      type: manifest_column_description
      model: stg_shipments
      column: cargo_type
      min_length: 25

  - id: describe_mart_model
    label: "Add a description to the fct_trade_routes mart"
    hint: "In _fct_trade_routes.yml, add a `description:` line for the mart. Analysts hit marts more than staging models, so this one matters."
    check:
      type: manifest_model_description
      model: fct_trade_routes
      min_length: 20

  - id: all_green
    label: "Click 'dbt run' — confirm descriptions compile cleanly into the manifest"
    hint: "Descriptions are metadata — they don't change query behavior but they have to parse. If a YAML quote is unbalanced or a doc block reference is misspelled, dbt errors at compile time."
    check:
      type: all_models_pass

narrative_triggers:
  - id: nt_intro
    event: LEVEL_START
    narrative_key: intro
    once: true

  - id: nt_doc_guide
    event: LEVEL_START
    narrative_key: doc_guide
    once: true

  - id: nt_first_run
    event: FIRST_RUN
    narrative_key: first_run_note
    once: true

  - id: nt_stg_desc_done
    event: OBJECTIVE_describe_shipment_id_COMPLETE
    narrative_key: stg_desc_done
    once: true

  - id: nt_doc_block_guide
    event: OBJECTIVE_describe_shipment_id_COMPLETE
    narrative_key: doc_block_guide
    once: true

  - id: nt_doc_block_done
    event: OBJECTIVE_reference_doc_block_COMPLETE
