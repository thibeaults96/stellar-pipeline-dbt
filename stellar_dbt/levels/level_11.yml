id: 11
title: "The Time Ledger"
subtitle: "Bonus arc — snapshots and a history of how the data used to look."
character: "NAV"
xp_reward: 280

badge:
  id: time_keeper
  emoji: "\U0001f570️"
  name: "Time Keeper"
  description: "Built a dbt snapshot — the warehouse now remembers every change to every shipment."
  xp: 280

locked_files:
  - models/staging/stg_planets.sql
  - models/staging/stg_shipments.sql
  - models/marts/fct_trade_routes.sql

seed_files:
  raw_shipments.csv: "shipment_id,origin_planet,dest_planet,cargo_type,cargo_mass,departed_at,arrived_at,status,updated_at\nSHP-001,K7B,MRD-9,supplies,1200kg,2847-03-01T08:00:00Z,2847-03-02T14:00:00Z,DELIVERED,2847-03-02T14:00:00Z\nSHP-002,TAU-4,K7B,equipment,4500kg,2847-03-01T12:00:00Z,2847-03-03T08:00:00Z,DELIVERED,2847-03-03T08:00:00Z\nSHP-003,MRD-9,ALF-C,humanitarian_aid,800kg,2847-02-28T22:00:00Z,2847-03-02T18:00:00Z,DELIVERED,2847-03-02T18:00:00Z\nSHP-004,ALF-C,TAU-4,fuel_cells,9200kg,2847-03-02T06:00:00Z,2847-03-04T10:00:00Z,DELIVERED,2847-03-04T10:00:00Z\nSHP-005,K7B,MRD-9,medical,340kg,2847-03-03T14:00:00Z,2847-03-04T22:00:00Z,DELIVERED,2847-03-04T22:00:00Z\nSHP-006,K7B,MRD-9,supplies,2100kg,2847-03-04T08:00:00Z,,IN_TRANSIT,2847-03-04T08:00:00Z\n"

initial_files:
  models/staging/stg_shipments.sql: |
    -- stg_shipments.sql (carried forward + updated_at passthrough)

    with source as (
        select * from {{ source('helios', 'raw_shipments') }}
    ),
    renamed as (
        select
            shipment_id,
            origin_planet as origin_planet_id,
            dest_planet as destination_planet_id,
            cargo_type,
            cast(replace(cargo_mass, 'kg', '') as integer) as cargo_mass_kg,
            cast(departed_at as timestamp) as departed_at,
            cast(arrived_at as timestamp) as arrived_at,
            lower(status) as status,
            cast(updated_at as timestamp) as updated_at
        from source
    )
    select * from renamed

  models/marts/fct_trade_routes.sql: |
    -- fct_trade_routes.sql (carried forward)
    {{ config(materialized='table') }}

    with shipments as (
        select * from {{ ref('stg_shipments') }}
    ), planets as (
        select * from {{ ref('stg_planets') }}
    ), routes as (
        select
            s.shipment_id, s.cargo_type, s.cargo_mass_kg, s.status,
            s.departed_at, s.arrived_at,
            origin.planet_name as origin_planet_name,
            dest.planet_name as destination_planet_name
    )
    select * from routes

  snapshots/shipment_snapshots.yml: |
    # Snapshot: track how shipment rows change over time.
    #
    # Fill in each TODO below — every line maps to an objective in the panel.
    # On first 'dbt snapshot' run, dbt captures the current state. On later
    # runs, it adds new versions of changed rows and stamps the old ones with
    # dbt_valid_to. The dbt_valid_from / dbt_valid_to / dbt_scd_id columns
    # are added automatically.

    snapshots:
      - name:                    # TODO: name this snapshot (check objectives)
        relation:                # TODO: which model to track? use ref('...')
        config:
          strategy:              # TODO: how should dbt detect changes? (hint: 'timestamp')
          unique_key:            # TODO: which column identifies each row?
          updated_at:            # TODO: which column tracks when rows change?

  models/sources/helios_sources.yml: |
    version: 2

    sources:
      - name: helios
        description: "Raw cargo telemetry from Helios Waystation receivers"
        schema: main
        tables:
          - name: raw_shipments
            description: "Cargo shipment records (status changes over time — snapshot captures the history)"
          - name: raw_planets
            description: "Planetary registry: ports of call along Helios routes"

objectives:
  - id: snapshot_name
    label: "Define a snapshot called shipment_status_snapshot"
    hint: "In shipment_snapshots.yml, replace the first TODO with: `- name: shipment_status_snapshot`."
    check:
      type: manifest_snapshot_exists
      snapshot_name: shipment_status_snapshot

  - id: snapshot_relation
    label: "Set the relation to ref('stg_shipments')"
    hint: "Add: `relation: ref('stg_shipments')`. This tells dbt which model to track for changes."
    check:
      type: manifest_snapshot_refs
      snapshot_name: shipment_status_snapshot
      target_model: stg_shipments

  - id: snapshot_strategy
    label: "Configure timestamp strategy with updated_at"
    hint: "Under config:, add `strategy: timestamp` and `updated_at: updated_at`. dbt compares the updated_at column to detect changes."
    check:
      type: manifest_snapshot_config
      snapshot_name: shipment_status_snapshot
      key: strategy
      value: timestamp

  - id: snapshot_unique_key
    label: "Set unique_key to shipment_id"
    hint: "Under config:, add `unique_key: shipment_id`. This tells dbt which column identifies each logical row."
    check:
      type: manifest_snapshot_config
      snapshot_name: shipment_status_snapshot
      key: unique_key
      value: shipment_id

  - id: all_green
    label: "Click 'dbt run' — all models still build with the new snapshot config"
    hint: "Snapshot definitions live in their own YAML — they don't affect model builds. Confirm everything still compiles."
    check:
      type: all_models_pass

  - id: run_snapshot
    label: "Click 'dbt snapshot' — capture the current state of every row"
    hint: "On first run, dbt snapshots the current state. If a row's updated_at later changes, dbt adds a new version of that row and stamps the old version's dbt_valid_to."
    check:
      type: snapshot_ran
      table: shipment_status_snapshot

narrative_triggers:
  - id: nt_intro
    event: LEVEL_START
    narrative_key: intro
    once: true

  - id: nt_start_guide
    event: LEVEL_START
    narrative_key: snapshot_guide
    once: true

  - id: nt_first_run
    event: FIRST_RUN
    narrative_key: first_run
    once: true

  - id: nt_name_done
    event: OBJECTIVE_snapshot_name_COMPLETE
    narrative_key: name_done
    once: true

  - id: nt_relation_done
    event: OBJECTIVE_snapshot_relation_COMPLETE
    narrative_key: relation_done
    once: true

  - id: nt_config_done
    event: OBJECTIVE_snapshot_unique_key_COMPLETE
    narrative_key: config_done
    once: true

  - id: nt_snapshot_ran
    event: SNAPSHOT_RUN
    narrative_key: snapshot_ran
    once: true

  - id: nt_complete
