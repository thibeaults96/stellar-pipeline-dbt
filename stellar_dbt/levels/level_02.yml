id: 2
title: "Boot the Pipeline"
subtitle: "Wire up the project. Make dbt aware of your raw data."
character: "NAV"
xp_reward: 140

badge:
  id: project_engineer
  emoji: "\U0001f527"
  name: "Project Engineer"
  description: "Configured the dbt project and declared sources so dbt knows where the raw data lives."
  xp: 140

locked_files:
  - models/staging/stg_planets.sql

seed_files:
  raw_shipments.csv: "shipment_id,origin_planet,dest_planet,cargo_type,cargo_mass,departed_at,arrived_at,status\nSHP-001,K7B,MRD-9,supplies,1200kg,2847-03-01T08:00:00Z,2847-03-02T14:00:00Z,DELIVERED\nSHP-002,TAU-4,K7B,equipment,4500kg,2847-03-01T12:00:00Z,2847-03-03T08:00:00Z,DELIVERED\nSHP-003,MRD-9,ALF-C,humanitarian_aid,800kg,2847-02-28T22:00:00Z,2847-03-02T18:00:00Z,DELIVERED\nSHP-004,ALF-C,TAU-4,fuel_cells,9200kg,2847-03-02T06:00:00Z,2847-03-04T10:00:00Z,DELIVERED\nSHP-005,K7B,MRD-9,medical,340kg,2847-03-03T14:00:00Z,2847-03-04T22:00:00Z,DELIVERED\n"

initial_files:
  models/sources/helios_sources.yml: |
    # helios_sources.yml
    #
    # This file is how dbt learns about the raw tables it can read from.
    # Each entry under `tables:` makes that table reachable via
    #     {{ source('helios', '<table_name>') }}
    # from your models. Without it, dbt has no idea raw_planets even exists,
    # and stg_planets.sql can't compile.
    #
    # Fill in the two TODOs below — each maps to an objective in the panel.
    # The raw CSVs are loaded by `dbt seed` into the `main` schema of DuckDB.

    version: 2

    sources:
      - name: helios
        description: "Raw cargo telemetry received at Helios Waystation"
        schema: main
        tables:
          # TODO: declare the raw cargo shipment table.
          # The seed file is named raw_shipments.csv.
          # Pattern:
          #   - name: <table_name>
          #     description: "<one-line summary>"

          # TODO: declare the raw planetary registry table.
          # The seed file is named raw_planets.csv.

objectives:
  - id: load_seeds
    label: "Click 'dbt seed' to load the raw CSVs into DuckDB"
    hint: "dbt seed is the first command on any new project — it loads everything under seeds/ into the warehouse so your models have something to read from."
    check:
      type: duckdb_row_count
      table: raw_shipments
      min_rows: 1

  - id: declare_raw_shipments
    label: "Declare raw_shipments under tables: in helios_sources.yml"
    hint: "Replace the first TODO with: `- name: raw_shipments` and a short description. Indentation matters — it lives under `tables:` of the `helios` source."
    check:
      type: file_contains
      filename: models/sources/helios_sources.yml
      pattern: "-\\s+name:\\s*raw_shipments"

  - id: declare_raw_planets
    label: "Declare raw_planets under tables: in helios_sources.yml"
    hint: "Same pattern as raw_shipments — `- name: raw_planets` with a description. stg_planets.sql calls `source('helios', 'raw_planets')` and won't compile until this is wired up."
    check:
      type: file_contains
      filename: models/sources/helios_sources.yml
      pattern: "-\\s+name:\\s*raw_planets"

  - id: run_pipeline
    label: "Click 'dbt run' — stg_planets should build cleanly now that sources are declared"
    hint: "If your sources YAML is missing a table, dbt errors out with a clear `Compilation Error` pointing at the source('helios', '...') that can't resolve. Once both tables are declared, the locked stg_planets.sql will compile and run."
    check:
      type: all_models_pass

narrative_triggers:
  - id: nt_start
    event: LEVEL_START
    narrative_key: intro
    once: true

  - id: nt_start_guide
    event: LEVEL_START
    narrative_key: project_tour
    once: true

  - id: nt_seed_done
    event: OBJECTIVE_load_seeds_COMPLETE
    narrative_key: seed_done
    once: true

  - id: nt_first_run_fail
    event: RUN_FAILURE
    narrative_key: run_fail
    once: true

  - id: nt_shipments_done
    event: OBJECTIVE_declare_raw_shipments_COMPLETE
    narrative_key: shipments_done
    once: true

  - id: nt_planets_done
    event: OBJECTIVE_declare_raw_planets_COMPLETE
    narrative_key: planets_done
    once: true

  - id: nt_run_success
    event: RUN_SUCCESS
    narrative_key: run_success
    once: true

  - id: nt_complete
    event: LEVEL_COMPLETE
    narrative_key: level_complete
    once: true

narrative_script:
  intro:
    id: intro
    character: NAV
    message: "Now we set up the project properly. Two things have to exist before dbt can do anything useful: the raw data has to be loaded, and dbt has to know about it. <highlight>Loading is dbt seed. Knowing about it is the sources YAML.</highlight> We'll do both this level."
    priority: high

  project_tour:
    id: project_tour
    character: NAV
    message: "Quick orientation on the file tree. <highlight>dbt_project.yml</highlight> at the root is the project config — name, profile, paths. <highlight>seeds/</highlight> holds your raw CSVs. <highlight>models/sources/</highlight> is where you declare sources for dbt. <highlight>models/staging/</highlight> and <highlight>models/marts/</highlight> are where your SQL transformations live. Open <highlight>helios_sources.yml</highlight> — you'll see two TODO comments where the source tables need to be declared."
    priority: normal

  seed_done:
    id: seed_done
    character: NAV
    message: "Seeds loaded. Now <highlight>raw_shipments</highlight> and <highlight>raw_planets</highlight> are real tables sitting in DuckDB under the <highlight>main</highlight> schema. But dbt itself doesn't know about them yet — only the database does. That's what the sources YAML fixes."
    priority: normal

  run_fail:
    id: run_fail
    character: NAV
    message: "Run failed. Read the error in the terminal — if it says <highlight>Compilation Error</highlight> and mentions a source that can't resolve, that means helios_sources.yml is missing the table. Sources are case-sensitive and indentation-sensitive. The pattern is exactly: `- name: raw_table_name` under `tables:`."
    priority: normal

  shipments_done:
    id: shipments_done
    character: NAV
    message: "raw_shipments is declared. One more — add raw_planets the same way. Once both are in, the locked <highlight>stg_planets.sql</highlight> will have everything it needs to compile."
    priority: normal

  planets_done:
    id: planets_done
    character: CDR. HOLT
    message: "I'm seeing both sources in your YAML. Good — that means anyone who walks into this project later can see exactly which raw tables we depend on. <highlight>Self-documenting infrastructure.</highlight> That's the whole pitch."
    priority: normal

  run_success:
    id: run_success
    character: NAV
    message: "stg_planets built. Notice dbt resolved <highlight>source('helios', 'raw_planets')</highlight> to the actual seeded table at compile time — that's the indirection that makes sources useful. If we ever move raw_planets to a different schema, we change one line of YAML, not every model."
    priority: high

  level_complete:
    id: level_complete
    character: NAV
    message: "Project is wired up. Seeds loaded, sources declared, first model built. <highlight>That's Set Up dbt.</highlight> Next level we leave the scaffolding behind and write real staging and mart models. Dr. Matsuri's been waiting to talk to you about the data."
    priority: high
