id: 7
title: "Ship It"
subtitle: "Production build and the merge to main."
character: "NAV"
xp_reward: 280

badge:
  id: shipped_it
  emoji: "\U0001f6f0️"
  name: "Shipped It"
  description: "Took the warehouse from dev to a production-shaped configuration with a real dbt build."
  xp: 280

locked_files:
  - models/staging/stg_planets.sql
  - models/staging/stg_shipments.sql
  - models/marts/fct_trade_routes.sql

seed_files:
  raw_shipments.csv: "shipment_id,origin_planet,dest_planet,cargo_type,cargo_mass,departed_at,arrived_at,status,loaded_at\nSHP-001,K7B,MRD-9,supplies,1200kg,2847-03-01T08:00:00Z,2847-03-02T14:00:00Z,DELIVERED,2847-03-02T06:00:00Z\nSHP-002,TAU-4,K7B,equipment,4500kg,2847-03-01T12:00:00Z,2847-03-03T08:00:00Z,DELIVERED,2847-03-03T07:00:00Z\nSHP-003,MRD-9,ALF-C,humanitarian_aid,800kg,2847-02-28T22:00:00Z,2847-03-02T18:00:00Z,DELIVERED,2847-03-02T19:00:00Z\nSHP-004,ALF-C,TAU-4,fuel_cells,9200kg,2847-03-02T06:00:00Z,2847-03-04T10:00:00Z,DELIVERED,2847-03-04T10:30:00Z\nSHP-005,K7B,MRD-9,medical,340kg,2847-03-03T14:00:00Z,2847-03-04T22:00:00Z,DELIVERED,2847-03-04T22:30:00Z\nSHP-006,K7B,MRD-9,supplies,2100kg,2847-03-04T08:00:00Z,2847-03-05T06:00:00Z,DELIVERED,2847-03-05T06:30:00Z\n"

initial_files:
  models/staging/stg_shipments.sql: |
    -- stg_shipments.sql (carried forward)

    with source as (
        select * from {{ source('helios', 'raw_shipments') }}
    ),
    renamed as (
        select
            shipment_id,
            origin_planet as origin_planet_id,
            dest_planet as destination_planet_id,
            cargo_type,
            cast(replace(cargo_mass, 'kg', '') as integer) as cargo_mass_kg,
            cast(departed_at as timestamp) as departed_at,
            cast(arrived_at as timestamp) as arrived_at,
            lower(status) as status
        from source
    )
    select * from renamed

  models/marts/fct_trade_routes.sql: |
    -- fct_trade_routes.sql (carried forward)

    with shipments as (
        select * from {{ ref('stg_shipments') }}
    ), planets as (
        select * from {{ ref('stg_planets') }}
    ), routes as (
        select
            s.shipment_id, s.cargo_type, s.cargo_mass_kg, s.status,
            s.departed_at, s.arrived_at,
            origin.planet_name as origin_planet_name,
            dest.planet_name as destination_planet_name,
            origin.sector as origin_sector
        from shipments s
        left join planets origin on s.origin_planet_id = origin.planet_id
        left join planets dest on s.destination_planet_id = dest.planet_id
    )
    select * from routes

  models/sources/helios_sources.yml: |
    version: 2

    sources:
      - name: helios
        description: "Raw cargo telemetry from Helios Waystation receivers"
        schema: main
        tables:
          - name: raw_shipments
            description: "Cargo shipment records from inbound and outbound vessels"
            loaded_at_field: loaded_at
            freshness:
              warn_after: {count: 24, period: hour}
              error_after: {count: 48, period: hour}
          - name: raw_planets
            description: "Planetary registry: ports of call along Helios routes"

  models/staging/_stg_shipments.yml: |
    version: 2

    models:
      - name: stg_shipments
        description: "Cleaned cargo shipment data — one row per shipment, with normalized types and renamed foreign keys."
        columns:
          - name: shipment_id
            description: "Unique identifier for each cargo shipment."
            tests:
              - not_null
              - unique
          - name: cargo_type
            description: "Category of cargo carried."
            tests:
              - accepted_values:
                  values: [supplies, equipment, humanitarian_aid, fuel_cells, medical]
          - name: origin_planet_id
            description: "Foreign key to stg_planets.planet_id (origin port)."
            tests:
              - relationships:
                  to: ref('stg_planets')
                  field: planet_id
          - name: status
            description: "Lowercased shipment status — 'delivered' or 'in_transit'."

  models/marts/_fct_trade_routes.yml: |
    version: 2

    models:
      - name: fct_trade_routes
        description: "One row per shipment with origin and destination planet metadata joined in. Analyst-facing trade-route mart."
        columns:
          - name: shipment_id
            description: "Unique shipment identifier carried through from staging."
          - name: origin_planet_name
            description: "Human-readable name of the origin planet."
          - name: destination_planet_name
            description: "Human-readable name of the destination planet."

objectives:
  - id: dbt_build
    label: "Click 'dbt build' — the production command that seeds + runs + tests in one shot"
    hint: "dbt build is the deployment command. It runs seeds, models, tests, and snapshots in dependency order, and stops downstream work if anything fails. If the whole build passes, the warehouse is shippable."
    # `model_passes` on the leaf confirms the full chain compiled without
    # gating on every later git objective the way `all_models_pass` would.
    # The player needs a green build *before* the git flow, not after, so
    # the gating in `_check_all` is the wrong direction here.
    check:
      type: model_passes
      model: fct_trade_routes

  # ── Git promotion flow (DEPLOY tab in the bottom pane) ──
  - id: git_commit
    label: "Commit your changes on the feature branch (DEPLOY tab → Commit)"
    hint: "Open the DEPLOY tab at the bottom of the screen. You're on `feature/deploy-pipeline`. Stage the changed files, write a commit message, and click Commit. A commit is a labeled snapshot of your work — separate from being merged."
    check:
      type: git_state
      key: committed

  - id: git_open_pr
    label: "Open a pull request from your branch to main"
    hint: "Click 'Open PR' in the DEPLOY tab. A pull request asks main's owners to review and accept your commit. In a real repo this triggers CI — here it auto-runs against your last dbt build."
    check:
      type: git_state
      key: pr_opened

  - id: git_merge
    label: "Merge the PR to main once CI is green"
    hint: "Once your PR shows CI passing, click 'Merge'. Merge is the moment your work officially becomes part of production. The scheduled refresh on main will pick it up on its next run."
    check:
      type: git_state
      key: merged

