id: 3
title: "First Models"
subtitle: "Staging, marts, and ref(). Build the spine of the warehouse."
character: "NAV"
xp_reward: 200

badge:
  id: first_model
  emoji: "\U0001f680"
  name: "First Model"
  description: "Built a staging model and a mart, wired together with ref() — the dbt way."
  xp: 200

locked_files:
  - models/staging/stg_planets.sql
  - models/sources/helios_sources.yml

seed_files:
  raw_shipments.csv: "shipment_id,origin_planet,dest_planet,cargo_type,cargo_mass,departed_at,arrived_at,status\nSHP-001,K7B,MRD-9,supplies,1200kg,2847-03-01T08:00:00Z,2847-03-02T14:00:00Z,DELIVERED\nSHP-002,TAU-4,K7B,equipment,4500kg,2847-03-01T12:00:00Z,2847-03-03T08:00:00Z,DELIVERED\nSHP-003,MRD-9,ALF-C,humanitarian_aid,800kg,2847-02-28T22:00:00Z,2847-03-02T18:00:00Z,DELIVERED\nSHP-004,ALF-C,TAU-4,fuel_cells,9200kg,2847-03-02T06:00:00Z,2847-03-04T10:00:00Z,DELIVERED\nSHP-005,K7B,MRD-9,medical,340kg,2847-03-03T14:00:00Z,2847-03-04T22:00:00Z,DELIVERED\n"

initial_files:
  models/staging/stg_shipments.sql: |
    -- stg_shipments.sql
    -- Staging model for raw cargo shipment data.
    --
    -- How this works:
    --   The "with source as (...)" block pulls raw data using source().
    --   source() tells dbt where the raw table lives so you don't hardcode names.
    --   The "renamed as (...)" block is where you clean up the columns.
    --   The final "select * from renamed" outputs your cleaned version.
    --
    -- What to do:
    --   1. Click "raw_shipments" under SOURCE DATA to see the raw columns
    --   2. Open stg_planets.sql to see a finished example
    --   3. Fill in the renamed block below
    --   4. Check the objectives panel for what each column needs
    --
    -- Raw columns: shipment_id, origin_planet, dest_planet, cargo_type,
    --              cargo_mass, departed_at, arrived_at, status

    with source as (

        select * from {{ source('helios', 'raw_shipments') }}

    ),

    renamed as (

        select
            -- Your columns go here. Check stg_planets.sql for the pattern:
            --     planet_id,
            --     planet_name,
            --     cast(population as bigint) as population
            *

        from source

    )

    select * from renamed

  models/marts/fct_trade_routes.sql: |
    -- fct_trade_routes.sql
    -- Mart model: combines staging models into something analysts can actually use.
    --
    -- Quick refresher on ref() vs source():
    --   source() pulls from raw external tables (used in staging models)
    --   ref() pulls from other dbt models (used here, in marts)
    --
    -- Example:  select * from  ref('stg_shipments')  (wrap in double curly braces)
    --
    -- Quick context on materializations:
    --   Every dbt model is a SELECT that gets materialized somewhere. By
    --   default, models materialize as VIEWS — lightweight, always fresh,
    --   no storage. But marts are usually queried a lot by analysts and
    --   dashboards, so we materialize them as TABLES to cache the result.
    --
    --   You set materialization per-model with a config block at the top:
    --
    --       {{ config(materialized='table') }}
    --
    --   (You can also configure it per-folder in dbt_project.yml — covered
    --   in a later level. Inline config wins when both are set.)
    --
    -- What to do:
    --   1. Add the config block at the top to materialize this as a table
    --   2. Use ref() to pull from stg_shipments and stg_planets
    --   3. Join them so each shipment gets its origin planet name
    --   4. Add a summary with count and total mass per origin planet
    --
    -- Check the objectives panel for the specifics.

    select 1 as placeholder
    -- Replace this with your query

objectives:
  # ── Phase 1: Clean the staging model ──
  - id: rename_columns
    label: "Rename origin_planet → origin_planet_id and dest_planet → destination_planet_id"
    hint: "Use the AS keyword: origin_planet as origin_planet_id. Renaming adds clarity — '_id' signals this is a foreign key."
    check:
      type: duckdb_columns_exist
      table: stg_shipments
      columns: [origin_planet_id, destination_planet_id]

  - id: cast_timestamps
    label: "Cast departed_at and arrived_at as timestamps"
    hint: "Either form works: `cast(departed_at as timestamp) as departed_at` or `departed_at::timestamp`. Do the same for arrived_at."
    check:
      type: duckdb_columns_exist
      table: stg_shipments
      columns: [departed_at, arrived_at]
      types:
        departed_at: TIMESTAMP
        arrived_at: TIMESTAMP

  - id: cast_cargo_mass
    label: "Clean cargo_mass → cargo_mass_kg as an integer (strip the 'kg' suffix first)"
    hint: "The raw values look like '1200kg'. Use replace(cargo_mass, 'kg', '') to strip the suffix, then cast to integer, then alias as cargo_mass_kg."
    check:
      type: duckdb_columns_exist
      table: stg_shipments
      columns: [cargo_mass_kg]
      types:
        cargo_mass_kg: INTEGER

  - id: normalize_status
    label: "Lowercase status values → status (e.g. 'DELIVERED' becomes 'delivered')"
    hint: "Use lower(status) as status."
    check:
      type: duckdb_column_values
      table: stg_shipments
      query: "SELECT * FROM main.stg_shipments WHERE status != lower(status)"

  # ── Phase 2: Build the mart with ref() ──
  - id: ref_shipments_in_mart
    label: "Pull shipment data into fct_trade_routes using ref()"
    hint: "In dbt, source() connects to raw data, but ref() connects models to each other. In your mart, write: {{ ref('stg_shipments') }}"
    check:
      type: has_ref_call
      filename: models/marts/fct_trade_routes.sql
      target_model: stg_shipments

  - id: ref_planets_in_mart
    label: "Pull planet data into fct_trade_routes using ref()"
    hint: "Same pattern: {{ ref('stg_planets') }}. This creates a dependency in the DAG — dbt will build stg_planets before fct_trade_routes automatically."
    check:
      type: has_ref_call
      filename: models/marts/fct_trade_routes.sql
      target_model: stg_planets

  - id: join_models
    label: "Join shipments to planets — include origin_planet_name in the output"
    hint: "Join stg_planets to get the planet name for each shipment's origin. Use: left join stg_planets origin on origin_planet_id = planet_id, then select origin.planet_name as origin_planet_name."
    check:
      type: duckdb_columns_exist
      table: fct_trade_routes
      columns: [origin_planet_name]

  - id: add_aggregation
    label: "Add a shipment_count and total_mass_kg aggregation grouped by origin_planet_name"
    hint: "Use count(*) as shipment_count and sum(cargo_mass_kg) as total_mass_kg with a GROUP BY on origin_planet_name. You can do this in a final CTE or a separate query block."
    check:
      type: duckdb_columns_exist
      table: fct_trade_routes
      columns: [origin_planet_name, shipment_count, total_mass_kg]

  - id: no_hardcoded_refs
    label: "No hardcoded table references in the mart"
    hint: "If you wrote a table name directly (like schema.table), replace it with ref(). That way if the table moves, your model still works."
    check:
      type: no_hardcoded_refs
      filename: models/marts/fct_trade_routes.sql

  - id: materialize_as_table
    label: "Materialize fct_trade_routes as a table (config block at the top)"
    hint: "Add `{{ config(materialized='table') }}` as the first line of fct_trade_routes.sql. Marts get queried a lot by analysts and dashboards, so they're typically materialized as tables (cached on disk) instead of views (recomputed every query). The default is view — you have to opt into table."
    # Reads the resolved materialization out of manifest.json so dbt itself
    # has to agree the model is a table. Catches the case where the config
    # block is malformed and dbt silently falls back to the default.
    check:
      type: manifest_model_config
      model: fct_trade_routes
      key: materialized
      value: table

  - id: all_green
    label: "Run dbt — all models pass"
    hint: "Click 'dbt run' to build all models."
    check:
      type: all_models_pass

narrative_triggers:
  - id: nt_intro
    event: LEVEL_START
    narrative_key: intro
    once: true

  - id: nt_matsuri
    event: LEVEL_START
    narrative_key: matsuri_briefing
    once: true

  - id: nt_staging_guide
    event: LEVEL_START
    narrative_key: staging_guide
    once: true

  - id: nt_first_run_fail
    event: RUN_FAILURE
    narrative_key: first_run_fail
    once: true

  - id: nt_source_staging_pattern
    event: OBJECTIVE_rename_columns_COMPLETE
    narrative_key: source_staging_pattern
    once: true

  - id: nt_staging_done
    event: OBJECTIVE_normalize_status_COMPLETE
    narrative_key: staging_complete
    once: true

  - id: nt_mart_guide
    event: OBJECTIVE_normalize_status_COMPLETE
    narrative_key: mart_guide
    once: true

  - id: nt_hardcode
    event: HARDCODE_DETECTED
    narrative_key: hardcode_warning
    once: true

  - id: nt_ref_explain
    event: OBJECTIVE_ref_shipments_in_mart_COMPLETE
    narrative_key: ref_importance
    once: true

  - id: nt_ref_done
    event:
      - OBJECTIVE_ref_planets_in_mart_COMPLETE
      - OBJECTIVE_ref_shipments_in_mart_COMPLETE
    narrative_key: join_guide
    requires:
      - ref_planets_in_mart
      - ref_shipments_in_mart
    once: true

  - id: nt_materialization
    event: OBJECTIVE_materialize_as_table_COMPLETE
    narrative_key: materialization_explain
    once: true

  - id: nt_all_green
    event: RUN_SUCCESS
    narrative_key: first_success
    once: true

  - id: nt_all_green_explain
    event: RUN_SUCCESS
    narrative_key: dag_explanation
    once: true

  - id: nt_analyses_aside
    event: RUN_SUCCESS
    narrative_key: analyses_aside
    once: true

  - id: nt_level_complete
    event: LEVEL_COMPLETE
    narrative_key: level_complete
    once: true

narrative_script:
  intro:
    id: intro
    character: NAV
    message: "Okay — sources are wired up, so dbt knows where the raw data lives. Now we actually <highlight>transform</highlight> it. Two layers this level: <highlight>staging</highlight> (clean per source table) and <highlight>marts</highlight> (analyst-facing combos of staging models). That's the standard dbt project shape."
    priority: high

  matsuri_briefing:
    id: matsuri_briefing
    character: DR. MATSURI
    message: "Kai Matsuri, head of logistics — Holt said you'd be down. Quick context on the cargo data: every row in raw_shipments is one delivery. <highlight>cargo_mass comes in as a string with a 'kg' suffix</highlight> because the loading bay scales output formatted text. status is whatever the dock crew typed — usually uppercase, sometimes mixed. Origin and destination columns are short planet codes. The planet name lives over in raw_planets. Standard mess. Clean it up however you like."
    priority: normal

  staging_guide:
    id: staging_guide
    character: NAV
    message: "Open <highlight>stg_shipments.sql</highlight> and click <highlight>raw_shipments</highlight> under SOURCE DATA so you can see the raw columns. <highlight>stg_planets.sql</highlight> is a finished example — same pattern. Basically: rename columns to use clearer IDs, cast types properly, normalize the values. The objectives panel has the specifics."
    priority: normal

  first_run_fail:
    id: first_run_fail
    character: NAV
    message: "Run didn't work — that's fine. Check the error output in the terminal, dbt is pretty good about telling you exactly what file and line broke. Seriously, read the error message, it'll save you a lot of guessing."
    priority: normal

  source_staging_pattern:
    id: source_staging_pattern
    character: NAV
    message: "Quick note on how dbt projects are usually set up. You generally want <highlight>one staging model for each source table</highlight>. So raw_shipments gets stg_shipments, raw_planets gets stg_planets. The staging layer is where all the cleaning happens, that way every model downstream is working with consistent, well-named columns. Nobody else has to worry about the raw data."
    priority: high

  staging_complete:
    id: staging_complete
    character: NAV
    message: "Staging looks clean. Time to build the mart."
    priority: high

  mart_guide:
    id: mart_guide
    character: NAV
    message: "Open <highlight>fct_trade_routes.sql</highlight>. This is a mart — where you combine staging models into something useful. Use <highlight>ref('stg_shipments')</highlight> and <highlight>ref('stg_planets')</highlight> to pull the data in. That's how dbt knows what depends on what. The comments in the file explain more."
    priority: normal

  ref_importance:
    id: ref_importance
    character: NAV
    message: "Reason we use ref() instead of writing the table name directly: ref() does two things. <highlight>It tells dbt this model depends on that model</highlight>, so dbt builds them in the right order. And if the underlying table ever moves or gets renamed, <highlight>ref() still resolves correctly</highlight>. Hardcoding table names is how you end up with stuff that breaks silently at 3am."
    priority: normal

  hardcode_warning:
    id: hardcode_warning
    character: NAV
    message: "Heads up — direct table reference in there. Use ref() instead. If you hardcode the name and that table moves, this model just breaks with no warning. ref() handles all of that for you."
    priority: high

  join_guide:
    id: join_guide
    character: NAV
    message: "Nice, both refs are wired up. Next step is joining the data. Each shipment has an <highlight>origin_planet_id</highlight> that maps to <highlight>planet_id</highlight> in stg_planets — join on that to pull in the origin planet name. Then for the route summary we need <highlight>count(*) as shipment_count</highlight> and <highlight>sum(cargo_mass_kg) as total_mass_kg</highlight> grouped by origin planet."
    priority: normal

  materialization_explain:
    id: materialization_explain
    character: NAV
    message: "Config block set. <highlight>Quick deeper dive on materializations</highlight> while you're here. dbt's default is <highlight>view</highlight> — the model becomes a CREATE VIEW statement that re-runs the SELECT every time someone queries it. Cheap, no storage, always fresh. For staging models (light cleaning, queried only by downstream models) that's perfect. <highlight>Marts get queried directly by analysts and dashboards</highlight>, often dozens of times per minute — a view there means recomputing the joins on every query. <highlight>materialized='table'</highlight> writes the result to disk once per dbt run, then every analyst query just reads from cache. There's also <highlight>ephemeral</highlight> (the model gets inlined as a CTE wherever it's ref'd, never written) and <highlight>incremental</highlight> for huge tables that are too expensive to rebuild every run — the bonus arc has a dedicated level on incremental. For most projects, though: staging → view, marts → table."
    priority: normal

  first_success:
    id: first_success
    character: NAV
    message: "Models compiled. Looking good."
    priority: high

  dag_explanation:
    id: dag_explanation
    character: NAV
    message: "Check the output — dbt built your models <highlight>in dependency order</highlight> automatically. Sources first, then staging, then the mart. You didn't have to tell it that. It figured it out from your ref() calls. That's basically the whole point of dbt: <highlight>you define the relationships, it handles the build order</highlight>."
    priority: normal

  analyses_aside:
    id: analyses_aside
    character: NAV
    message: "Quick aside on a folder we haven't touched yet. dbt has an <highlight>analyses/</highlight> folder for SQL files that compile (so you get ref() and source() resolution) but <highlight>don't materialize</highlight> as tables or views. Use it for ad-hoc analyst queries you want versioned alongside the project — Holt's quarterly business reviews, root-cause queries during an incident — without polluting the warehouse with one-off tables. Not needed for this level, just worth knowing it's there."
    priority: low

  level_complete:
    id: level_complete
    character: NAV
    message: "Staging and marts are live. Holt's got her first real table to look at. <highlight>That's the Models lesson.</highlight> Next we go back to sources and make them production-grade — freshness, schemas, the works."
    priority: high
