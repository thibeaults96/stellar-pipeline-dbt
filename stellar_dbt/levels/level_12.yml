id: 12
title: "The Priority Pipeline"
subtitle: "Bonus arc — Jinja macros and the reusable SQL pattern."
character: "NAV"
xp_reward: 300

badge:
  id: toolsmith
  emoji: "\U0001f9f0"
  name: "Toolsmith"
  description: "Wrote a Jinja macro and called it from a model — reusable SQL, one source of truth."
  xp: 300

locked_files:
  - models/staging/stg_planets.sql
  - models/staging/stg_shipments.sql
  - models/marts/fct_trade_routes.sql

seed_files:
  raw_shipments.csv: "shipment_id,origin_planet,dest_planet,cargo_type,cargo_mass,departed_at,arrived_at,status\nSHP-001,K7B,MRD-9,supplies,1200kg,2847-03-01T08:00:00Z,2847-03-02T14:00:00Z,DELIVERED\nSHP-002,TAU-4,K7B,equipment,4500kg,2847-03-01T12:00:00Z,2847-03-03T08:00:00Z,DELIVERED\nSHP-003,MRD-9,ALF-C,humanitarian_aid,800kg,2847-02-28T22:00:00Z,2847-03-02T18:00:00Z,DELIVERED\nSHP-004,ALF-C,TAU-4,fuel_cells,9200kg,2847-03-02T06:00:00Z,2847-03-04T10:00:00Z,DELIVERED\nSHP-005,K7B,MRD-9,medical,340kg,2847-03-03T14:00:00Z,2847-03-04T22:00:00Z,DELIVERED\nSHP-006,K7B,MRD-9,supplies,2100kg,2847-03-04T08:00:00Z,2847-03-05T06:00:00Z,DELIVERED\n"

initial_files:
  models/staging/stg_shipments.sql: |
    -- stg_shipments.sql (carried forward)

    with source as (
        select * from {{ source('helios', 'raw_shipments') }}
    ),
    renamed as (
        select
            shipment_id,
            origin_planet as origin_planet_id,
            dest_planet as destination_planet_id,
            cargo_type,
            cast(replace(cargo_mass, 'kg', '') as integer) as cargo_mass_kg,
            cast(departed_at as timestamp) as departed_at,
            cast(arrived_at as timestamp) as arrived_at,
            lower(status) as status
        from source
    )
    select * from renamed

  models/marts/fct_trade_routes.sql: |
    -- fct_trade_routes.sql (carried forward)
    {{ config(materialized='table') }}

    with shipments as (
        select * from {{ ref('stg_shipments') }}
    ), planets as (
        select * from {{ ref('stg_planets') }}
    ), routes as (
        select
            s.shipment_id, s.cargo_type, s.cargo_mass_kg, s.status,
            s.departed_at, s.arrived_at,
            origin.planet_name as origin_planet_name,
            dest.planet_name as destination_planet_name
        from shipments s
        left join planets origin on s.origin_planet_id = origin.planet_id
        left join planets dest on s.destination_planet_id = dest.planet_id
    )
    select * from routes

  models/sources/helios_sources.yml: |
    version: 2

    sources:
      - name: helios
        description: "Raw cargo telemetry from Helios Waystation receivers"
        schema: main
        tables:
          - name: raw_shipments
            description: "Cargo shipment records"
          - name: raw_planets
            description: "Planetary registry: ports of call along Helios routes"

  macros/cargo_priority.sql: |
    -- cargo_priority.sql
    --
    -- This is a MACRO file. Macros are reusable Jinja functions you can call
    -- from any model. They live in the macros/ folder and dbt picks them up
    -- automatically.
    --
    -- Your job: write a macro called `cargo_priority` that takes a column
    -- name and returns a CASE WHEN expression categorizing the cargo:
    --
    --   medical                            → 'critical'
    --   fuel_cells, humanitarian_aid       → 'high'
    --   anything else                      → 'standard'
    --
    -- Macro syntax:
    --
    --   {% macro example_macro(column_name) %}
    --       case
    --           when {{ column_name }} = 'foo' then 'bar'
    --           else 'baz'
    --       end
    --   {% endmacro %}
    --
    -- Notes on the delimiters:
    --   {% ... %} wraps Jinja control statements (macro, endmacro, if, for).
    --   {{ ... }} substitutes a value into the rendered SQL — here, the
    --   parameter `column_name` becomes the column reference inside the CASE.
    --
    -- Calling it from a model looks like:
    --
    --   {{ cargo_priority('cargo_type') }} as priority
    --
    -- Replace this comment block with your macro definition.

  models/marts/fct_priority_routes.sql: |
    -- fct_priority_routes.sql
    --
    -- Build a derived mart that uses your cargo_priority macro to add a
    -- priority column. Steps:
    --
    --   1. Pull from fct_trade_routes using ref()
    --   2. Project all the existing columns through
    --   3. Add a new `priority` column by calling {{ cargo_priority('cargo_type') }}
    --
    -- The whole point of the macro: if the priority rules change later, you
    -- edit one .sql file in macros/ instead of every model that uses them.

    select 1 as placeholder
    -- Replace this with your query

objectives:
  # ── Phase 1: Define the macro ──
  - id: define_macro
    label: "Define a `cargo_priority` macro in macros/cargo_priority.sql"
    hint: "Replace the comment block with: `{% macro cargo_priority(column_name) %}` then a CASE WHEN that returns 'critical' for medical, 'high' for fuel_cells or humanitarian_aid, 'standard' otherwise, then `{% endmacro %}`. Reference the parameter inside the CASE with `{{ column_name }}`."
    # The manifest only registers a macro if dbt parses it cleanly — malformed
    # Jinja or a missing {% endmacro %} leaves it out. Reading the manifest is
    # the strictest check available.
    check:
      type: manifest_macro_defined
      macro_name: cargo_priority

  # ── Phase 2: Build the mart that calls the macro ──
  - id: ref_trade_routes
    label: "Pull data from fct_trade_routes using ref() in fct_priority_routes"
    hint: "Same pattern as every other mart: `select * from {{ ref('fct_trade_routes') }}`. The macro builds on this — it adds a priority column derived from cargo_type."
    check:
      type: has_ref_call
      filename: models/marts/fct_priority_routes.sql
      target_model: fct_trade_routes

  - id: call_macro
    label: "Call the cargo_priority macro to produce a `priority` column"
    hint: "In the SELECT, add: `{{ cargo_priority('cargo_type') }} as priority`. dbt expands the macro at compile time — the CASE WHEN you wrote gets inlined wherever you call it. If the rules change later, you change them once."
    # depends_on.macros only registers a call if dbt actually rendered it.
    # A bare 'cargo_priority(...)' in a comment or string literal won't pass.
    check:
      type: manifest_model_depends_on_macro
      model: fct_priority_routes
      macro_name: cargo_priority

  - id: verify_priority_values
    label: "The priority column should contain 'critical', 'high', and 'standard' values"
    hint: "Once the model is built, the priority column gets populated based on the cargo types in fct_trade_routes. The seed has medical (critical), fuel_cells + humanitarian_aid (high), and supplies + equipment (standard). All three buckets should appear."
    check:
      type: duckdb_column_values
      table: fct_priority_routes
      query: "SELECT 1 FROM main.fct_priority_routes WHERE priority NOT IN ('critical', 'high', 'standard')"

  # ── Phase 3: Run it ──
  - id: all_green
    label: "Run dbt — all models pass"
    hint: "Click 'dbt run' to build fct_priority_routes alongside the existing marts. If the macro doesn't compile, dbt will tell you exactly which Jinja line is wrong."
    check:
      type: all_models_pass

