id: 5
title: "The Time Ledger"
subtitle: "Track how data changes over time."
character: "R0-B3RT"
xp_reward: 230

badge:
  id: time_keeper
  emoji: "\U0001f570\ufe0f"
  name: "Time Keeper"
  description: "Built a dbt snapshot to track how shipment data changes over time."
  xp: 230

locked_files:
  - models/staging/stg_planets.sql
  - models/staging/stg_shipments.sql
  - models/marts/fct_trade_routes.sql

seed_files:
  raw_shipments.csv: "shipment_id,origin_planet,dest_planet,cargo_type,cargo_mass,departed_at,arrived_at,status,voss_flag,updated_at\nSHP-001,K7B,MRD-9,supplies,1200kg,2847-03-01T08:00:00Z,2847-03-02T14:00:00Z,DELIVERED,0,2847-03-02T14:00:00Z\nSHP-002,TAU-4,K7B,equipment,4500kg,2847-03-01T12:00:00Z,2847-03-03T08:00:00Z,DELIVERED,0,2847-03-03T08:00:00Z\nSHP-003,MRD-9,NM-00,humanitarian_aid,800kg,2847-02-28T22:00:00Z,,IN_TRANSIT,1,2847-03-04T00:00:00Z\nSHP-004,ALF-C,TAU-4,fuel_cells,9200kg,2847-03-02T06:00:00Z,2847-03-04T10:00:00Z,DELIVERED,0,2847-03-04T10:00:00Z\nSHP-005,K7B,MRD-9,medical,340kg,2847-03-03T14:00:00Z,2847-03-04T22:00:00Z,DELIVERED,0,2847-03-04T22:00:00Z\nSHP-006,K7B,NM-00,classified,2200kg,2847-03-04T01:00:00Z,,IN_TRANSIT,1,2847-03-05T00:00:00Z\n"

initial_files:
  models/staging/stg_shipments.sql: |
    -- stg_shipments.sql (carried forward)

    with source as (
        select * from {{ source('federation', 'raw_shipments') }}
    ),
    renamed as (
        select shipment_id, origin_planet as origin_planet_id,
            dest_planet as destination_planet_id, cargo_type,
            cast(replace(cargo_mass, 'kg', '') as integer) as cargo_mass_kg,
            cast(departed_at as timestamp) as departed_at,
            cast(arrived_at as timestamp) as arrived_at,
            lower(status) as status, voss_flag, updated_at
        from source
    )
    select * from renamed

  models/marts/fct_trade_routes.sql: |
    -- fct_trade_routes.sql (carried forward)

    with shipments as (
        select * from {{ ref('stg_shipments') }}
    ), planets as (
        select * from {{ ref('stg_planets') }}
    ), routes as (
        select s.shipment_id, s.cargo_type, s.cargo_mass_kg, s.status,
            s.departed_at, s.arrived_at, s.voss_flag,
            origin.planet_name as origin_planet_name,
            dest.planet_name as destination_planet_name,
            dest.is_federation_member as dest_is_federation
        from shipments s
        left join planets origin on s.origin_planet_id = origin.planet_id
        left join planets dest on s.destination_planet_id = dest.planet_id
    )
    select * from routes

  snapshots/shipment_snapshots.yml: |
    # shipment_snapshots.yml
    #
    # SNAPSHOTS track how rows change over time. Unlike regular models that
    # always show current state, a snapshot keeps a history of every change.
    #
    # In dbt, snapshots are defined in YAML files in the snapshots/ folder.
    # Each snapshot needs:
    #   - name: what to call the snapshot table
    #   - relation: which model or source to snapshot (using ref() or source())
    #   - config: how to detect changes
    # See dbt docs for syntax.
    #
    # The 'timestamp' strategy compares the updated_at column to detect changes.
    # The 'unique_key' tells dbt which column identifies each row.
    #
    # dbt automatically adds tracking columns:
    #   dbt_valid_from  — when this version of the row became active
    #   dbt_valid_to    — when it was replaced (NULL if still current)
    #   dbt_scd_id      — unique ID for each version
    #
    # Check the objectives panel for specifics.

  models/sources/federation_sources.yml: |
    version: 2

    sources:
      - name: federation
        description: "Raw telemetry data from Federation sensor arrays"
        schema: main
        tables:
          - name: raw_shipments
            description: "Cargo shipment records from all registered vessels"
          - name: raw_planets
            description: "Planetary registry and resource data"

objectives:
  - id: snapshot_name
    label: "Define a snapshot called shipment_status_snapshot"
    hint: "In shipment_snapshots.yml, start with: snapshots: then add - name: shipment_status_snapshot"
    check:
      type: file_contains
      filename: snapshots/shipment_snapshots.yml
      pattern: "name:\\s*shipment_status_snapshot"

  - id: snapshot_relation
    label: "Set the relation to ref('stg_shipments')"
    hint: "Add: relation: ref('stg_shipments'). This tells dbt which model to track for changes."
    check:
      type: file_contains
      filename: snapshots/shipment_snapshots.yml
      pattern: "relation:\\s*ref\\(['\"]stg_shipments['\"]\\)"

  - id: snapshot_strategy
    label: "Configure timestamp strategy with updated_at"
    hint: "Under config:, add strategy: timestamp and updated_at: updated_at. This tells dbt to detect changes by comparing the updated_at column."
    check:
      type: file_contains
      filename: snapshots/shipment_snapshots.yml
      pattern: "strategy:\\s*timestamp"

  - id: snapshot_unique_key
    label: "Set unique_key to shipment_id"
    hint: "Under config:, add unique_key: shipment_id. This tells dbt which column identifies each row."
    check:
      type: file_contains
      filename: snapshots/shipment_snapshots.yml
      pattern: "unique_key:\\s*shipment_id"

  - id: run_snapshot
    label: "Run dbt snapshot successfully"
    hint: "Click 'dbt snapshot' to run it. On first run it captures the current state of all rows."
    check:
      type: snapshot_ran
      table: shipment_status_snapshot

  - id: all_green
    label: "Run dbt — all models pass"
    hint: "Click 'dbt run' to confirm all models are still building cleanly alongside your new snapshot."
    check:
      type: all_models_pass

narrative_triggers:
  - id: nt_start
    event: LEVEL_START
    narrative_key: intro
    once: true

  - id: nt_start_guide
    event: LEVEL_START
    narrative_key: snapshot_guide
    once: true

  - id: nt_first_run
    event: FIRST_RUN
    narrative_key: first_run
    once: true

  - id: nt_name_done
    event: OBJECTIVE_snapshot_name_COMPLETE
    narrative_key: name_done
    once: true

  - id: nt_relation_done
    event: OBJECTIVE_snapshot_relation_COMPLETE
    narrative_key: relation_done
    once: true

  - id: nt_config_done
    event: OBJECTIVE_snapshot_unique_key_COMPLETE
    narrative_key: config_done
    once: true

  - id: nt_snapshot_run
    event: SNAPSHOT_RUN
    narrative_key: snapshot_ran
    once: true

  - id: nt_all_green_guide
    event: OBJECTIVE_run_snapshot_COMPLETE
    narrative_key: final_run_guide
    once: true

  - id: nt_complete
    event: LEVEL_COMPLETE
    narrative_key: level_complete
    once: true

narrative_script:
  intro:
    id: intro
    character: R0-B3RT
    message: "We've got a new problem. Shipments keep changing status, IN_TRANSIT to DELIVERED, sometimes back to IN_TRANSIT. But our models only show the current state. When something changes, the old data is gone. We need a way to <highlight>track how data changes over time</highlight>. That's what dbt snapshots do."
    priority: high

  snapshot_guide:
    id: snapshot_guide
    character: R0-B3RT
    message: "Open <highlight>snapshots/shipment_snapshots.yml</highlight>. In modern dbt, snapshots are defined in YAML, not SQL. You set a name, point it at a model with <highlight>relation:</highlight>, and configure how dbt detects changes. The comments in the file explain the structure."
    priority: normal

  first_run:
    id: first_run
    character: R0-B3RT
    message: "Models ran fine. Now set up the snapshot definition. You need to tell dbt what to call it, which model to track, and how to detect changes."
    priority: normal

  name_done:
    id: name_done
    character: R0-B3RT
    message: "Good, the snapshot is named. Now add <highlight>relation: ref('stg_shipments')</highlight> to tell dbt which model to snapshot. This is like how models use ref() to declare dependencies."
    priority: normal

  relation_done:
    id: relation_done
    character: R0-B3RT
    message: "Relation is set. Now add the config block. You need <highlight>strategy: timestamp</highlight> (dbt compares timestamps to detect changes), <highlight>unique_key: shipment_id</highlight> (identifies each row), and <highlight>updated_at: updated_at</highlight> (the column dbt watches for changes)."
    priority: normal

  config_done:
    id: config_done
    character: R0-B3RT
    message: "Config looks good. Now click <highlight>dbt snapshot</highlight> to run it. On the first run, dbt captures the current state of every row. If you ran it again after the data changed, it would create new versions of the changed rows while keeping the old ones."
    priority: normal

  snapshot_ran:
    id: snapshot_ran
    character: R0-B3RT
    message: "Snapshot ran. Check the preview tab for <highlight>shipment_status_snapshot</highlight>. You'll see the dbt-added columns: dbt_valid_from (when this version started), dbt_valid_to (NULL for current rows), and dbt_scd_id. If a shipment's status changes later, the old row gets a dbt_valid_to timestamp and a new row appears."
    priority: normal

  final_run_guide:
    id: final_run_guide
    character: R0-B3RT
    message: "Snapshot is set up. Run dbt to make sure all models are still building cleanly."
    priority: normal

  level_complete:
    id: level_complete
    character: R0-B3RT
    message: "Snapshots are running. Now we have a complete audit trail of every shipment change. If someone modifies a VOSS-flagged shipment's status after the fact, the snapshot catches it. The old data doesn't just disappear anymore. That's how you build accountability into a pipeline."
    priority: high
