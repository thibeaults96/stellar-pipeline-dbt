id: 5
title: "Trust but Verify"
subtitle: "Generic tests — not_null, unique, accepted_values, relationships."
character: "NAV"
xp_reward: 220

badge:
  id: quality_guardian
  emoji: "\U0001f6e1️"
  name: "Quality Guardian"
  description: "Wired up all four generic dbt tests and watched them catch bad rows in production data."
  xp: 220

locked_files:
  - models/staging/stg_planets.sql
  - models/staging/stg_shipments.sql
  - models/marts/fct_trade_routes.sql

seed_files:
  # Seed mixes in deliberately broken rows so each generic test has something
  # to catch:
  #   SHP-NULL row → catches `not_null` on shipment_id
  #   SHP-002 appears twice → catches `unique` on shipment_id
  #   UNKNOWN_TYPE cargo → catches `accepted_values` on cargo_type
  #   origin_planet=ZZZ (no such planet) → catches `relationships` on origin_planet_id
  #   SHP-008 routes MRD-9 → MRD-9 (origin==destination) → catches the singular test
  raw_shipments.csv: "shipment_id,origin_planet,dest_planet,cargo_type,cargo_mass,departed_at,arrived_at,status\nSHP-001,K7B,MRD-9,supplies,1200kg,2847-03-01T08:00:00Z,2847-03-02T14:00:00Z,DELIVERED\nSHP-002,TAU-4,K7B,equipment,4500kg,2847-03-01T12:00:00Z,2847-03-03T08:00:00Z,DELIVERED\n,MRD-9,ALF-C,humanitarian_aid,800kg,2847-02-28T22:00:00Z,2847-03-02T18:00:00Z,DELIVERED\nSHP-002,ALF-C,TAU-4,fuel_cells,9200kg,2847-03-02T06:00:00Z,2847-03-04T10:00:00Z,DELIVERED\nSHP-005,K7B,MRD-9,medical,340kg,2847-03-03T14:00:00Z,2847-03-04T22:00:00Z,DELIVERED\nSHP-006,ZZZ,MRD-9,supplies,1500kg,2847-03-04T08:00:00Z,,IN_TRANSIT\nSHP-007,K7B,MRD-9,UNKNOWN_TYPE,500kg,2847-03-04T10:00:00Z,,IN_TRANSIT\nSHP-008,MRD-9,MRD-9,supplies,500kg,2847-03-04T12:00:00Z,,IN_TRANSIT\n"

initial_files:
  models/staging/stg_shipments.sql: |
    -- stg_shipments.sql (carried forward)

    with source as (
        select * from {{ source('helios', 'raw_shipments') }}
    ),
    renamed as (
        select
            shipment_id,
            origin_planet as origin_planet_id,
            dest_planet as destination_planet_id,
            cargo_type,
            cast(replace(cargo_mass, 'kg', '') as integer) as cargo_mass_kg,
            cast(departed_at as timestamp) as departed_at,
            cast(arrived_at as timestamp) as arrived_at,
            lower(status) as status
        from source
    )
    select * from renamed

  models/marts/fct_trade_routes.sql: |
    -- fct_trade_routes.sql (carried forward)
    {{ config(materialized='table') }}

    with shipments as (
        select * from {{ ref('stg_shipments') }}
    ), planets as (
        select * from {{ ref('stg_planets') }}
    ), routes as (
        select
            s.shipment_id, s.cargo_type, s.cargo_mass_kg, s.status,
            s.departed_at, s.arrived_at,
            origin.planet_name as origin_planet_name,
            dest.planet_name as destination_planet_name,
            origin.sector as origin_sector
        from shipments s
        left join planets origin on s.origin_planet_id = origin.planet_id
        left join planets dest on s.destination_planet_id = dest.planet_id
    )
    select * from routes

  models/sources/helios_sources.yml: |
    version: 2

    sources:
      - name: helios
        description: "Raw cargo telemetry from Helios Waystation receivers"
        schema: main
        tables:
          - name: raw_shipments
            description: "Cargo shipment records from inbound and outbound vessels"
          - name: raw_planets
            description: "Planetary registry: ports of call along Helios routes"

  models/staging/_stg_shipments.yml: |
    version: 2

    models:
      - name: stg_shipments
        description: "Cleaned cargo shipment data"
        columns:
          - name: shipment_id
            description: "Unique identifier for each shipment"
            # TODO: add a tests: list here with `- not_null` and `- unique`.

          - name: cargo_type
            description: "Category of cargo carried"
            # TODO: add a tests: list with `- accepted_values: values: [...]`.
            # Valid cargo types in this dataset:
            #   supplies, equipment, humanitarian_aid, fuel_cells, medical
            # Do NOT include UNKNOWN_TYPE — that's the bad data the test should catch.

          - name: origin_planet_id
            description: "Foreign key to stg_planets.planet_id (origin port)"
            # TODO: add a tests: list with `- relationships:`
            # The relationships test needs `to:` and `field:` kwargs:
            #   - relationships:
            #       to: ref('stg_planets')
            #       field: planet_id

objectives:
  - id: initial_run
    label: "Click 'dbt run' first — the broken rows still build, that's the whole problem"
    hint: "dbt won't validate row contents unless you tell it to. Everything will compile and pass — and the bad data slips through. That's exactly the point. Once the models are materialized, the tests you add next have something to check against."
    check:
      type: model_passes
      model: fct_trade_routes

  - id: add_not_null_test
    label: "Add a `not_null` test on shipment_id in _stg_shipments.yml"
    hint: "Under shipment_id's `tests:` list, add `- not_null`. dbt will compile this into a query that fails if any row has a NULL shipment_id."
    check:
      type: manifest_column_test
      model: stg_shipments
      column: shipment_id
      test_name: not_null

  - id: add_unique_test
    label: "Add a `unique` test on shipment_id"
    hint: "Same column, same list: `- unique`. This catches duplicate primary keys — the seed has SHP-002 appearing twice."
    check:
      type: manifest_column_test
      model: stg_shipments
      column: shipment_id
      test_name: unique

  - id: add_accepted_values_test
    label: "Add an `accepted_values` test on cargo_type with the valid types"
    hint: "Under cargo_type, write `- accepted_values:` then `values: [supplies, equipment, humanitarian_aid, fuel_cells, medical]` indented under it. Do NOT include UNKNOWN_TYPE — that's the row the test should catch."
    check:
      type: manifest_column_test
      model: stg_shipments
      column: cargo_type
      test_name: accepted_values
      required_values: [supplies, equipment, humanitarian_aid, fuel_cells, medical]
      forbidden_values: [UNKNOWN_TYPE, unknown_type]

  - id: add_relationships_test
    label: "Add a `relationships` test on origin_planet_id → stg_planets.planet_id"
    hint: "Under origin_planet_id, add: `- relationships:` then `to: ref('stg_planets')` and `field: planet_id`. This verifies every foreign key resolves to a real planet — SHP-006's `ZZZ` origin should fail."
    check:
      type: manifest_column_test
      model: stg_shipments
      column: origin_planet_id
      test_name: relationships

  - id: write_singular_test
    label: "Write a singular test in tests/no_self_routing.sql"
    hint: "Generic tests cover \"every column needs to be unique / not_null / etc.\" Singular tests catch business rules that don't fit that pattern. Create `tests/no_self_routing.sql` — a SELECT that returns rows ONLY when the rule is violated. The rule: a shipment shouldn't have the same origin and destination. SQL: `select * from {{ ref('stg_shipments') }} where origin_planet_id = destination_planet_id`. dbt picks up the file automatically — no YAML registration needed."
    check:
      type: file_contains
      filename: tests/no_self_routing.sql
      pattern: "origin_planet_id\\s*=\\s*destination_planet_id"

  - id: run_tests
    label: "Click 'dbt test' — the generic + singular tests run together"
    hint: "dbt test runs every test in the project: the 4 generic ones you added to YAML, plus every .sql file in tests/. Multiple tests will fail — that's the whole point. Singular tests fail if their SELECT returns any rows; generic tests fail if their compiled query returns any."
    check:
      type: tests_ran_with_failures

  - id: all_green
    label: "Click 'dbt run' — confirm models still build with the new test config"
    hint: "Tests are metadata to the run step. The models keep building; tests run separately. Confirm dbt run still finishes clean."
    check:
      type: all_models_pass

narrative_triggers:
  - id: nt_intro
    event: LEVEL_START
    narrative_key: intro
    once: true

  - id: nt_matsuri
    event: LEVEL_START
    narrative_key: matsuri_warning
    once: true

  - id: nt_first_run
    event: OBJECTIVE_initial_run_COMPLETE
    narrative_key: data_problem
    once: true

  - id: nt_unique_done
    event: OBJECTIVE_add_unique_test_COMPLETE
    narrative_key: identity_tests_done
    once: true

  - id: nt_accepted_done
    event: OBJECTIVE_add_accepted_values_test_COMPLETE
    narrative_key: accepted_done
    once: true

  - id: nt_relationships_done
    event: OBJECTIVE_add_relationships_test_COMPLETE
    narrative_key: relationships_done
    once: true

  - id: nt_singular_guide
    event: OBJECTIVE_add_relationships_test_COMPLETE
    narrative_key: singular_guide
    once: true

  - id: nt_singular_done
    event: OBJECTIVE_write_singular_test_COMPLETE
    narrative_key: singular_done
    once: true

  - id: nt_test_results
    event: OBJECTIVE_run_tests_COMPLETE
    narrative_key: test_results
    once: true

  - id: nt_build_tip
    event: OBJECTIVE_run_tests_COMPLETE
    narrative_key: build_tip
    once: true

  - id: nt_complete
    event: LEVEL_COMPLETE
    narrative_key: level_complete
    once: true

narrative_script:
  intro:
    id: intro
    character: NAV
    message: "The pipeline builds. Holt thinks it works. But <highlight>nothing's been validated</highlight>. The dock crew typed some of this data by hand. A new shift took over yesterday and used a cargo type that doesn't officially exist. One vessel logged an origin port that isn't in the registry. This is the test layer — where we make dbt fail loudly when the data is wrong."
    priority: high

  matsuri_warning:
    id: matsuri_warning
    character: DR. MATSURI
    message: "Two things you should know before you write tests. <highlight>shipment_id is supposed to be unique and never null</highlight> — it's the dock crew's manifest number. <highlight>cargo_type</highlight> has a fixed list of values from the Helios cargo catalog; anything else is a typo. And every origin port should map to a planet in the registry. If any of those rules don't hold, we've got a quality issue."
    priority: normal

  data_problem:
    id: data_problem
    character: NAV
    message: "Pipeline built fine. Now click <highlight>raw_shipments</highlight> in the data preview. <highlight>One row has no shipment_id. Two rows share SHP-002. Cargo type 'UNKNOWN_TYPE' shows up where it shouldn't. And origin 'ZZZ' doesn't match any planet.</highlight> Without tests, all four problems just flow downstream invisibly. Time to write the four classic generic tests."
    priority: high

  identity_tests_done:
    id: identity_tests_done
    character: NAV
    message: "not_null and unique are in. <highlight>Together they make a primary key contract.</highlight> Any row that breaks either one means the source data is malformed, and dbt will scream about it on the next test run. Now let's add the bounded-set check."
    priority: normal

  accepted_done:
    id: accepted_done
    character: NAV
    message: "Good. <highlight>accepted_values</highlight> is the test you reach for when a column should only ever be one of a known set. Status fields, cargo types, country codes. The forbidden_values UNKNOWN_TYPE row will fail on the next dbt test — exactly the behavior we want. One more test: relationships."
    priority: normal

  relationships_done:
    id: relationships_done
    character: NAV
    message: "<highlight>relationships</highlight> is dbt's referential integrity test — it checks every value in origin_planet_id actually exists in stg_planets.planet_id. SHP-006's ZZZ won't match anything in the planet registry. That's a foreign key violation the test will catch."
    priority: normal

  singular_guide:
    id: singular_guide
    character: NAV
    message: "Four generic tests handle the common shapes — uniqueness, nullability, allowed values, foreign keys. But <highlight>some rules are specific to your domain</highlight>. Example: a shipment that goes from MRD-9 → MRD-9 is nonsense — origin shouldn't equal destination. No generic test catches that. <highlight>Singular tests</highlight> are the answer: a `.sql` file in `tests/` whose SELECT returns the bad rows. dbt picks up everything in tests/ automatically — no YAML registration. Write one for the self-routing case."
    priority: normal

  singular_done:
    id: singular_done
    character: NAV
    message: "Singular test written. <highlight>The shape of a singular test</highlight>: SELECT that returns rows iff the rule is violated. Zero rows = passing, anything else = failing. The file name (`no_self_routing`) becomes the test name in dbt's output. Now click <highlight>dbt test</highlight> and watch the full battery run — four generic plus your singular."
    priority: normal

  test_results:
    id: test_results
    character: NAV
    message: "There it is. <highlight>Five failing tests, five real data quality issues</highlight>. The models still built — dbt didn't pretend the data was clean — but now anyone reading the test output knows exactly what's broken. <highlight>You didn't fix the data, that's the source team's problem. What you did is make the breakage impossible to miss.</highlight>"
    priority: high

  build_tip:
    id: build_tip
    character: NAV
    message: "Quick tip — you've been running <highlight>dbt run</highlight> and <highlight>dbt test</highlight> separately. There's a command called <highlight>dbt build</highlight> that does both in one shot, in dependency order: seeds, models, tests, snapshots. From now on you can use that instead."
    priority: normal

  level_complete:
    id: level_complete
    character: NAV
    message: "Tests are wired up. Bad rows now fail loudly. <highlight>That's the Data Tests lesson.</highlight> Next: documentation — because the test that catches a bad row is twice as useful when the column's description tells you what the row should look like."
    priority: high
