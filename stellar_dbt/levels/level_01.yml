id: 1
title: "Welcome to Helios"
subtitle: "Get oriented. Load the data. Meet the team."
character: "NAV"
xp_reward: 100

badge:
  id: arrival
  emoji: "\U0001f6f0️"
  name: "Arrival"
  description: "Stepped onto Helios Waystation and made first contact with the data."
  xp: 100

locked_files:
  - models/staging/stg_planets.sql
  - models/sources/helios_sources.yml

seed_files:
  raw_shipments.csv: "shipment_id,origin_planet,dest_planet,cargo_type,cargo_mass,departed_at,arrived_at,status\nSHP-001,K7B,MRD-9,supplies,1200kg,2847-03-01T08:00:00Z,2847-03-02T14:00:00Z,DELIVERED\nSHP-002,TAU-4,K7B,equipment,4500kg,2847-03-01T12:00:00Z,2847-03-03T08:00:00Z,DELIVERED\nSHP-003,MRD-9,ALF-C,humanitarian_aid,800kg,2847-02-28T22:00:00Z,2847-03-02T18:00:00Z,DELIVERED\nSHP-004,ALF-C,TAU-4,fuel_cells,9200kg,2847-03-02T06:00:00Z,2847-03-04T10:00:00Z,DELIVERED\nSHP-005,K7B,MRD-9,medical,340kg,2847-03-03T14:00:00Z,2847-03-04T22:00:00Z,DELIVERED\n"

initial_files: {}

objectives:
  - id: load_seeds
    label: "Click 'dbt seed' to load the raw cargo data into DuckDB"
    hint: "There's a dbt seed button in the toolbar at the top. dbt seed loads CSV files from the seeds/ folder into the warehouse. One thing to keep in mind: this isn't how raw data normally lands. In a real project a loading tool (Fivetran, Airbyte, a custom EL job) brings the raw data in, and seed is reserved for small, static reference data. Here we use it to stand in for that loading step so your models have something to work with."
    check:
      type: duckdb_row_count
      table: raw_shipments
      min_rows: 1

  - id: first_run
    label: "Click 'dbt run' to build the project's one starter model"
    hint: "stg_planets.sql is already wired up for you — it pulls from the raw_planets seed and renames a few columns. Click 'dbt run' to materialize it. You'll see dbt resolve dependencies and build it in order."
    check:
      type: all_models_pass

narrative_triggers:
  - id: nt_welcome
    event: LEVEL_START
    narrative_key: welcome
    once: true

  - id: nt_briefing
    event: LEVEL_START
    narrative_key: briefing
    once: true

  - id: nt_adlc
    event: LEVEL_START
    narrative_key: adlc
    once: true

  - id: nt_tour
    event: LEVEL_START
    narrative_key: tour
    once: true

  - id: nt_seed_done
    event: OBJECTIVE_load_seeds_COMPLETE
    narrative_key: seed_done
    once: true

  - id: nt_first_run_fail
    event: RUN_FAILURE
    narrative_key: first_run_fail
    once: true

  - id: nt_run_success
    event: RUN_SUCCESS
    narrative_key: run_success
    once: true

  - id: nt_level_complete
    event: LEVEL_COMPLETE
    narrative_key: level_complete
    once: true

narrative_script:
  welcome:
    id: welcome
    character: NAV
    message: "Hey. Welcome aboard <highlight>Helios Waystation</highlight>. I'm NAV, your pipeline companion AI, and I'll walk you through the rebuild. Your predecessor left in a hurry. Mid-shift, never came back, took the coffee maker with her kind of hurry. Good news: the warehouse hardware is fine. Bad news: the analytics is a stack of one-off SQL scripts on her desk that I'm legally not allowed to call a pipeline."
    priority: high

  briefing:
    id: briefing
    character: CDR. HOLT
    message: "Commander Ena Holt, station ops. Glad you're here. Short version: <highlight>I need a warehouse I can trust before the next supply cycle</highlight>. Cargo manifests, route stats, the works. Right now I'm reading dashboards and I have no idea how any of them were built. Take it from raw to ready. NAV will get you started. If you want to know what the data actually means, talk to Dr. Matsuri down in logistics."
    priority: high

  adlc:
    id: adlc
    character: NAV
    message: "Before we touch anything, a bit of orientation. The <highlight>Analytics Development Lifecycle</highlight> is how dbt thinks about building a warehouse: <highlight>plan → develop → test → deploy → operate → observe → discover → analyze</highlight>. We'll spend most of our time on the build side of that, but it's worth seeing the whole loop. Right now we're at the \"plan\" stage. We know what Holt wants, and we know roughly what raw data we have. Next up is getting that raw data loaded so we can actually look at it."
    priority: normal

  tour:
    id: tour
    character: NAV
    message: "Fast tour of your console. <highlight>Left panel</highlight> is the file tree, where your project lives. <highlight>Center</highlight> is the code editor, where you'll write SQL and YAML. <highlight>Bottom</highlight> is terminal output and the DAG. <highlight>Top</highlight> is the run buttons. Start with <highlight>dbt seed</highlight>. It loads the CSVs in seeds/ into DuckDB so we've got raw tables to query. Out in the real world a loading tool would land that raw data for you; seeds are just our stand-in here so we have something to work with."
    priority: normal

  seed_done:
    id: seed_done
    character: NAV
    message: "Seeds loaded. <highlight>raw_shipments</highlight> and <highlight>raw_planets</highlight> are real tables in DuckDB now. Click either one under SOURCE DATA to peek at the rows. Don't fix anything yet, just look. That's the \"plan\" step. Now for a tiny \"develop\" step. There's already one staging model in the project (stg_planets.sql) so you can see the shape of things. Click <highlight>dbt run</highlight> to build it."
    priority: normal

  first_run_fail:
    id: first_run_fail
    character: NAV
    message: "Run failed. No big deal, happens to everyone. Read the error in the terminal. dbt is usually pretty specific about which file and line broke. If you haven't run the seed step yet, dbt run will fail because the source tables don't exist, so try <highlight>dbt seed</highlight> first."
    priority: normal

  run_success:
    id: run_success
    character: NAV
    message: "<highlight>stg_planets</highlight> built. Notice dbt worked out the build order on its own. It saw the source() call, made sure raw_planets existed first, then ran the staging model. This is the core idea: <highlight>you describe the relationships, dbt handles the order.</highlight> We'll build a lot more of these next level."
    priority: high

  level_complete:
    id: level_complete
    character: NAV
    message: "Nice. Tour done, raw data loaded, first model built. That wraps the <highlight>welcome</highlight>. Next level we set the project up properly: sources YAML, project config, all the bones. Holt'll be back once there's something worth looking at."
    priority: high

quiz:
  - question: "What does `dbt seed` do?"
    options:
      - "Loads CSV files from the seeds/ folder into the warehouse as tables"
      - "Generates random test data for your models"
      - "Compiles your SQL models into the target/ folder"
      - "Runs every model in your project from scratch"
    correct: 0
    explanation: "dbt seed reads CSVs from seeds/ and creates real tables in the warehouse. It's a quick way to get reference or fixture data in without setting up an EL tool."
  - question: "Which phase of the Analytics Development Lifecycle covers writing and iterating on models locally?"
    options:
      - "Plan"
      - "Develop"
      - "Deploy"
      - "Operate"
    correct: 1
    explanation: "Develop is where you write SQL, run dbt locally, and iterate. Plan is the upstream framing, Deploy ships to production, and Operate keeps it running."
